name: فحص المنصة

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: التحقق واختبارات الوحدة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: التحقق من البنية والبيانات وتشغيل الاختبارات
        run: npm run build

  browser:
    name: اختبارات المتصفح
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت Playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: تشغيل اختبارات المتصفح
        run: npm run test:e2e
