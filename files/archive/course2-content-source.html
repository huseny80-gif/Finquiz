<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eng. Hussein Yaseen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="hp-main-style">
/* ============ Design tokens ============ */
:root{
  --ink:#10162B;
  --ink-soft:#3C4569;
  --ink-faint:#6B7394;
  --paper:#F1F4F9;
  --surface:#FFFFFF;
  --surface-2:#E9EDF5;
  --accent:#137C73;       /* teal — digital thread */
  --accent-ink:#0B4A44;
  --accent-2:#A9781F;     /* brass — leadership/diploma thread */
  --accent-2-ink:#6E4E12;
  --line:rgba(16,22,43,0.12);
  --line-soft:rgba(16,22,43,0.07);
  --good:#1C8A5A;
  --bad:#B7402F;
  --good-tint:rgba(28,138,90,0.14);
  --bad-tint:rgba(183,64,47,0.12);
  --shadow:0 1px 2px rgba(16,22,43,.05), 0 8px 24px -12px rgba(16,22,43,.18);

  --sub-ai:#137C73;
  --sub-legal:#33528F;
  --sub-innov:#A9781F;
  --sub-cyber:#A03B33;
  --sub-risk:#6C5A96;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E9ECF7;
    --ink-soft:#B7BEDA;
    --ink-faint:#8A91B5;
    --paper:#0B0F1E;
    --surface:#141A2E;
    --surface-2:#1B2338;
    --accent:#3FC2B6;
    --accent-ink:#BEF3EB;
    --accent-2:#E0B84E;
    --accent-2-ink:#F6DFA0;
    --line:rgba(233,236,247,0.14);
    --line-soft:rgba(233,236,247,0.08);
    --good:#3FCB8B;
    --bad:#E5766A;
    --good-tint:rgba(63,203,139,0.16);
    --bad-tint:rgba(229,118,106,0.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);

    --sub-ai:#3FC2B6;
    --sub-legal:#7C9AE0;
    --sub-innov:#E0B84E;
    --sub-cyber:#E5766A;
    --sub-risk:#B39EE8;
  }
}
:root[data-theme="dark"]{
  --ink:#E9ECF7;
  --ink-soft:#B7BEDA;
  --ink-faint:#8A91B5;
  --paper:#0B0F1E;
  --surface:#141A2E;
  --surface-2:#1B2338;
  --accent:#3FC2B6;
  --accent-ink:#BEF3EB;
  --accent-2:#E0B84E;
  --accent-2-ink:#F6DFA0;
  --line:rgba(233,236,247,0.14);
  --line-soft:rgba(233,236,247,0.08);
  --good:#3FCB8B;
  --bad:#E5766A;
  --good-tint:rgba(63,203,139,0.16);
  --bad-tint:rgba(229,118,106,0.16);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);

  --sub-ai:#3FC2B6;
  --sub-legal:#7C9AE0;
  --sub-innov:#E0B84E;
  --sub-cyber:#E5766A;
  --sub-risk:#B39EE8;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);}
.hp-app{
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  min-height:100vh;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.hp-app *{min-width:0;}
h1,h2,h3,h4{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:700;text-wrap:balance;margin:0;color:var(--ink);}
.hp-mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
a{color:inherit;}
button{font-family:inherit;}

/* ============ Shell layout ============ */
.hp-shell{display:flex;flex-direction:column;min-height:100vh;}
.hp-topbar{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;
}
.hp-brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.hp-seal{
  width:42px;height:42px;border-radius:12px;flex:0 0 auto;
  background:var(--surface-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:"Reem Kufi",sans-serif;font-size:17px;font-weight:700;
  box-shadow:var(--shadow);padding:5px;
}
.hp-seal img{width:100%;height:100%;object-fit:contain;display:block;}
.hp-brand-text{display:flex;flex-direction:column;gap:1px;}
.hp-brand-name{font-family:"Reem Kufi",sans-serif;font-size:17px;letter-spacing:.2px;}
.hp-brand-sub{font-size:11px;color:var(--ink-faint);letter-spacing:.3px;}
.hp-crumb{
  flex:1 1 auto;min-width:0;
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--ink-faint);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  padding-inline-start:8px;border-inline-start:1px solid var(--line);
}
.hp-crumb b{color:var(--ink-soft);font-weight:600;}
.hp-menu-btn{
  display:none;flex:0 0 auto;
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;color:var(--ink);
  align-items:center;justify-content:center;
}
.hp-menu-btn svg{width:18px;height:18px;}

.hp-body{display:flex;flex:1 1 auto;min-height:0;}

/* ---- sidebar / nav ---- */
.hp-nav{
  flex:0 0 272px;
  border-inline-end:1px solid var(--line);
  background:var(--surface);
  padding:16px 12px 28px;
  overflow-y:auto;
}
.hp-nav-label{
  font-size:11px;color:var(--ink-faint);letter-spacing:.6px;
  padding:14px 10px 8px;text-transform:uppercase;
}
.hp-nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 10px;border-radius:12px;border:1px solid transparent;
  background:none;cursor:pointer;text-align:right;color:var(--ink-soft);
  font-size:14px;margin-bottom:3px;transition:background .15s,border-color .15s;
}
.hp-nav-item:hover{background:var(--surface-2);}
.hp-nav-item.active{background:var(--surface-2);border-color:var(--line);color:var(--ink);font-weight:600;}
.hp-chip{
  flex:0 0 auto;width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:700;font-family:"IBM Plex Sans Arabic";
}
.hp-chip.hp-chip-logo{background:var(--surface-2);border:1px solid var(--line);padding:4px;}
.hp-chip.hp-chip-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.hp-nav-item-text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hp-nav-progress{flex:0 0 auto;font-size:10px;color:var(--ink-faint);font-family:"IBM Plex Mono";}
.hp-nav-soon{flex:0 0 auto;font-size:9px;color:var(--ink-faint);background:var(--paper);border:1px solid var(--line);padding:2px 6px;border-radius:20px;}

/* ---- main / view ---- */
.hp-main{flex:1 1 auto;min-width:0;overflow-y:auto;}
.hp-view{max-width:920px;margin:0 auto;padding:26px 22px 90px;}

/* ============ Home ============ */
.hp-hero{
  border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(145deg,var(--surface),var(--surface-2));
  padding:30px 26px;box-shadow:var(--shadow);margin-bottom:26px;
}
.hp-hero-eyebrow{font-size:12px;color:var(--accent-ink);letter-spacing:.5px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.hp-hero-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);}
.hp-hero h1{font-size:clamp(24px,4vw,32px);margin-bottom:10px;}
.hp-hero p{color:var(--ink-soft);font-size:15px;max-width:62ch;margin:0;}
.hp-hero-stats{display:flex;gap:22px;margin-top:20px;flex-wrap:wrap;}
.hp-stat b{display:block;font-family:"Reem Kufi";font-size:22px;color:var(--ink);}
.hp-stat span{font-size:12px;color:var(--ink-faint);}

.hp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.hp-card{
  border:1px solid var(--line);border-radius:16px;background:var(--surface);
  padding:18px;cursor:pointer;text-align:right;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s;
}
.hp-card:hover{transform:translateY(-2px);border-color:var(--accent);}
.hp-card-top{display:flex;align-items:center;justify-content:space-between;}
.hp-card h3{font-size:16px;}
.hp-card p{margin:0;font-size:12.5px;color:var(--ink-faint);line-height:1.6;}
.hp-bar{height:6px;border-radius:20px;background:var(--surface-2);overflow:hidden;}
.hp-bar > i{display:block;height:100%;border-radius:20px;background:var(--accent);}

/* ============ About ============ */
.hp-about-card{
  display:flex;gap:22px;align-items:center;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:18px;background:var(--surface);
  padding:22px;box-shadow:var(--shadow);
}
.hp-about-photo{
  flex:0 0 auto;width:140px;height:140px;border-radius:18px;overflow:hidden;
  border:1px solid var(--line);background:var(--surface-2);
}
.hp-about-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.hp-about-info{flex:1 1 260px;min-width:0;}
.hp-about-info h3{font-size:19px;margin-bottom:4px;}
.hp-about-role{
  display:inline-block;font-size:12px;font-weight:600;color:var(--accent-ink);
  background:var(--good-tint);border-radius:20px;padding:3px 12px;margin-bottom:12px;
}
.hp-about-facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
.hp-about-facts li{font-size:13.5px;color:var(--ink-soft);line-height:1.7;}
.hp-about-facts b{color:var(--ink);}

.hp-contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.hp-contact-card{
  display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);padding:14px 16px;box-shadow:var(--shadow);text-decoration:none;
  color:inherit;transition:transform .15s,border-color .15s;
}
.hp-contact-card:hover{transform:translateY(-2px);border-color:var(--accent);}
.hp-contact-icon{flex:0 0 auto;font-size:22px;line-height:1;}
.hp-contact-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
.hp-contact-text b{font-size:12.5px;color:var(--ink-faint);font-weight:600;}
.hp-contact-text span:last-child{font-size:14px;color:var(--ink);font-family:"IBM Plex Mono";overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ============ Section header ============ */
.hp-section-head{margin-bottom:20px;}
.hp-section-head .hp-eyebrow{font-size:12px;color:var(--ink-faint);letter-spacing:.4px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.hp-section-head h2{font-size:clamp(20px,3.4vw,26px);}
.hp-section-head p{color:var(--ink-soft);font-size:14px;margin-top:8px;max-width:70ch;}

/* ============ Tabs ============ */
.hp-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;padding-bottom:1px;}
.hp-tab{
  flex:0 0 auto;padding:10px 16px;font-size:13.5px;color:var(--ink-faint);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;
  white-space:nowrap;font-weight:600;
}
.hp-tab.active{color:var(--ink);border-color:var(--accent);}

/* ============ Lecture accordion ============ */
.hp-acc{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);}
.hp-acc-head{
  display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;background:none;border:none;width:100%;text-align:right;
}
.hp-acc-num{
  flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono";font-size:12px;color:var(--ink-soft);
}
.hp-acc-title{flex:1 1 auto;font-size:15px;font-weight:600;color:var(--ink);}
.hp-acc-arrow{flex:0 0 auto;color:var(--ink-faint);transition:transform .2s;}
.hp-acc.open .hp-acc-arrow{transform:rotate(180deg);}
.hp-acc-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.hp-acc.open .hp-acc-body{max-height:6000px;}
.hp-acc-inner{padding:0 18px 20px 18px;color:var(--ink-soft);font-size:14.5px;}
.hp-acc-inner h4{font-size:13.5px;color:var(--accent-ink);margin:14px 0 6px;font-family:"IBM Plex Sans Arabic";font-weight:700;}
.hp-acc-inner p{margin:0 0 10px;}
.hp-acc-inner ul{margin:0 0 10px;padding-inline-start:20px;}
.hp-acc-inner li{margin-bottom:5px;}
.hp-acc-inner .hp-note{
  background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;color:var(--ink-soft);
}
.hp-acc-inner .hp-keypoints{
  background:var(--surface-2);border-inline-start:3px solid var(--accent);border-radius:10px;
  padding:11px 13px;margin:0 0 14px;font-size:13px;
}
.hp-acc-inner .hp-keypoints .hp-kp-title{
  display:block;font-size:11.5px;font-weight:700;color:var(--accent-ink);
  letter-spacing:.3px;margin-bottom:6px;
}
.hp-acc-inner .hp-keypoints ul{margin:0;padding-inline-start:18px;}
.hp-acc-inner .hp-keypoints li{margin-bottom:4px;color:var(--ink-soft);}
.hp-acc-inner .hp-keypoints li:last-child{margin-bottom:0;}
.hp-acc-inner .hp-formula{font-family:"IBM Plex Mono";font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;color:var(--ink);line-height:1.9;overflow-x:auto;}
.hp-acc-inner .hp-cmp-wrap{overflow-x:auto;margin:10px 0;}
table.hp-cmp{border-collapse:collapse;width:100%;min-width:420px;font-size:13.5px;}
table.hp-cmp th{background:var(--surface-2);color:var(--ink);font-weight:700;padding:9px 12px;text-align:right;border:1px solid var(--line);font-family:"IBM Plex Sans Arabic";}
table.hp-cmp td{padding:9px 12px;border:1px solid var(--line);color:var(--ink-soft);}
table.hp-cmp tr:nth-child(even) td{background:var(--paper);}

/* ============ Summary ============ */
.hp-sum-card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px 18px 6px;margin-bottom:16px;box-shadow:var(--shadow);}
.hp-sum-card h3{font-size:15px;margin-bottom:10px;color:var(--accent-ink);}
.hp-sum-card ul{margin:0 0 14px;padding-inline-start:20px;color:var(--ink-soft);font-size:14px;}
.hp-sum-card li{margin-bottom:7px;}
.hp-formula{
  font-family:"IBM Plex Mono";font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin:10px 0 16px;color:var(--ink);line-height:1.9;overflow-x:auto;
}

/* ============ Exercise cards ============ */
.hp-ex{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);}
.hp-ex-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.hp-lvl{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;border:1px solid var(--line);}
.hp-lvl[data-lvl="بسيط"]{color:var(--good);border-color:var(--good);}
.hp-lvl[data-lvl="متوسط"]{color:var(--accent-2-ink);border-color:var(--accent-2);}
.hp-lvl[data-lvl="متقدم"]{color:var(--bad);border-color:var(--bad);}
.hp-ex h4{font-size:14.5px;font-weight:700;}
.hp-ex p{margin:6px 0 0;font-size:14px;color:var(--ink-soft);}
.hp-deliver{margin-top:10px;font-size:13px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:9px 12px;}
mark.hp-hl{background:var(--good-tint);color:var(--ink);border-radius:4px;padding:0 4px;font-weight:600;}

/* ---- case studies ---- */
.hp-cs-head{margin-bottom:14px;}
.hp-cs-head h3{font-size:16px;margin-bottom:6px;color:var(--accent-ink);}
.hp-cs-head p{font-size:13.5px;color:var(--ink-soft);}
.hp-hw-head{margin:26px 0 14px;padding-top:18px;border-top:1px solid var(--line);}
.hp-hw-head h3{font-size:16px;color:var(--accent-ink);}
.hp-case{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
.hp-case h4{font-size:14.5px;font-weight:700;}
.hp-situ{margin:0 0 10px;font-size:13.5px;color:var(--ink-soft);}
.hp-steps{margin:0 0 12px;padding-inline-start:20px;color:var(--ink-soft);font-size:13.5px;}
.hp-steps li{margin-bottom:6px;}
.hp-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.hp-tool-chip{font-size:11px;font-family:"IBM Plex Mono";color:var(--accent-ink);background:var(--good-tint);border-radius:20px;padding:3px 10px;}
.hp-out{margin:0;font-size:13.5px;color:var(--ink);background:var(--surface-2);border-radius:10px;padding:9px 12px;border-inline-start:3px solid var(--accent-2);}

/* ---- homework model-answer rich content ---- */
.hp-model h5{font-size:13px;color:var(--accent-ink);margin:0 0 8px;font-weight:700;}
.hp-model p{margin:0 0 8px;}
.hp-model ol,.hp-model ul{margin:0 0 8px;padding-inline-start:20px;}
.hp-model li{margin-bottom:5px;}
.hp-sample{
  font-family:"IBM Plex Sans Arabic";font-size:13px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin:8px 0;color:var(--ink);line-height:1.9;
}
.hp-crit{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:9px 12px;}
.hp-model .hp-cmp-wrap{overflow-x:auto;margin:8px 0;}

/* ============ Quiz ============ */
.hp-qwrap{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px 18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.hp-qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.hp-qhead h3{font-size:15.5px;}
.hp-score{
  font-family:"IBM Plex Mono";font-size:12px;padding:5px 12px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);
}
.hp-retry{
  font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  padding:6px 12px;border-radius:20px;cursor:pointer;
}
.hp-retry:hover{border-color:var(--accent);color:var(--accent-ink);}

.hp-q{border-top:1px solid var(--line-soft);padding:16px 0;}
.hp-q:first-of-type{border-top:none;padding-top:2px;}
.hp-q-text{font-size:14.5px;font-weight:600;margin-bottom:10px;color:var(--ink);}
.hp-opts{display:flex;flex-direction:column;gap:8px;}
.hp-opt{
  display:flex;align-items:center;gap:10px;text-align:right;
  padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--paper);
  cursor:pointer;font-size:13.5px;color:var(--ink-soft);
}
.hp-opt:hover{border-color:var(--accent);}
.hp-opt.correct{border-color:var(--good);background:var(--good-tint);color:var(--ink);}
.hp-opt.wrong{border-color:var(--bad);background:var(--bad-tint);color:var(--ink);}
.hp-opt.disabled{cursor:default;}
.hp-opt-mark{
  flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;font-family:"IBM Plex Mono";
}
.hp-opt.correct .hp-opt-mark{background:var(--good);border-color:var(--good);color:#fff;}
.hp-opt.wrong .hp-opt-mark{background:var(--bad);border-color:var(--bad);color:#fff;}

.hp-tf-row{display:flex;gap:10px;}
.hp-tf-btn{
  flex:1 1 0;padding:9px 10px;border-radius:11px;border:1px solid var(--line);background:var(--paper);
  cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);
}
.hp-tf-btn:hover{border-color:var(--accent);}
.hp-tf-btn.correct{border-color:var(--good);background:var(--good-tint);color:var(--ink);}
.hp-tf-btn.wrong{border-color:var(--bad);background:var(--bad-tint);color:var(--ink);}
.hp-tf-btn.disabled{cursor:default;}

.hp-explain{
  margin-top:10px;font-size:13px;color:var(--ink-soft);background:var(--surface-2);
  border-radius:10px;padding:9px 12px;display:none;
}
.hp-explain.show{display:block;}

.hp-open textarea{
  width:100%;min-height:74px;border:1px solid var(--line);border-radius:11px;background:var(--paper);
  color:var(--ink);font-family:inherit;font-size:13.5px;padding:10px 12px;resize:vertical;margin-bottom:8px;
}
.hp-reveal-btn{
  font-size:12.5px;border:1px solid var(--accent);color:var(--accent-ink);background:none;
  padding:6px 13px;border-radius:20px;cursor:pointer;font-weight:600;
}
.hp-model{
  margin-top:10px;font-size:13.5px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;
  padding:11px 13px;display:none;border-inline-start:3px solid var(--accent-2);
}
.hp-model.show{display:block;}
.hp-open-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hp-alt-btn{border-color:var(--accent-2)!important;color:var(--accent-2-ink)!important;}
.hp-model.hp-answer{border-inline-start-color:var(--accent);}

/* ---- end-of-tab actions ---- */
.hp-end-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 4px;}
.hp-top-btn{
  font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  padding:9px 20px;border-radius:20px;box-shadow:var(--shadow);
}
.hp-top-btn:hover{border-color:var(--accent);color:var(--accent-ink);}
.hp-home-btn{border-color:var(--accent);color:var(--accent-ink);}
.hp-home-btn:hover{background:var(--good-tint);}

.hp-wk{
  display:inline-block;font-family:"IBM Plex Mono";font-size:10.5px;font-weight:500;
  color:var(--accent-ink);background:var(--good-tint);border-radius:20px;padding:2px 9px;
  margin-inline-end:8px;vertical-align:middle;position:relative;top:-1px;
}
.hp-cov-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.hp-cov-pct{font-family:"IBM Plex Mono";font-size:16px;font-weight:600;}
.hp-cov-label{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;}
.hp-cov-pct.excellent,.hp-cov-label.excellent{color:var(--good);}
.hp-cov-label.excellent{background:var(--good-tint);}
.hp-cov-pct.good,.hp-cov-label.good{color:var(--accent-ink);}
.hp-cov-label.good{background:var(--good-tint);}
.hp-cov-pct.partial,.hp-cov-label.partial{color:var(--accent-2-ink);}
.hp-cov-label.partial{background:rgba(169,120,31,0.14);}
.hp-cov-pct.weak,.hp-cov-label.weak{color:var(--bad);}
.hp-cov-label.weak{background:var(--bad-tint);}
.hp-cov-bar{height:7px;border-radius:20px;background:var(--paper);border:1px solid var(--line);overflow:hidden;margin-bottom:12px;}
.hp-cov-fill{height:100%;border-radius:20px;transition:width .3s ease;}
.hp-cov-fill.excellent,.hp-cov-fill.good{background:var(--good);}
.hp-cov-fill.partial{background:var(--accent-2);}
.hp-cov-fill.weak{background:var(--bad);}
.hp-cov-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.hp-cov-list li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink-soft);}
.hp-chk{flex:0 0 auto;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:"IBM Plex Mono";color:#fff;margin-top:1px;}
.hp-cov-list li.hit .hp-chk{background:var(--good);}
.hp-cov-list li.miss .hp-chk{background:var(--bad);}
.hp-cov-list li.hit{color:var(--ink);}

/* ============ empty / soon ============ */
.hp-soon{
  border:1px dashed var(--line);border-radius:18px;padding:44px 24px;text-align:center;color:var(--ink-soft);
  background:var(--surface);
}
.hp-soon-icn{
  width:52px;height:52px;border-radius:14px;margin:0 auto 14px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-faint);
}
.hp-soon h3{font-size:17px;margin-bottom:8px;color:var(--ink);}
.hp-soon p{font-size:13.5px;max-width:44ch;margin:0 auto;}

footer.hp-foot{padding:26px 22px 40px;text-align:center;color:var(--ink-faint);font-size:12px;}

/* ============ responsive ============ */
@media (max-width:900px){
  .hp-menu-btn{display:flex;}
  .hp-body{position:relative;}
  .hp-nav{
    position:fixed;inset-inline-start:0;top:0;bottom:0;z-index:40;
    transform:translateX(105%);transition:transform .22s ease;width:78vw;max-width:300px;
    box-shadow:0 0 0 100vmax rgba(0,0,0,0);
  }
  .hp-nav.open{transform:translateX(0);box-shadow:20px 0 60px rgba(0,0,0,.28);}
  .hp-nav-scrim{display:none;position:fixed;inset:0;background:rgba(8,10,20,.45);z-index:39;}
  .hp-nav-scrim.show{display:block;}
  .hp-view{padding:20px 14px 80px;}
  .hp-hero{padding:22px 18px;}
  .hp-crumb{font-size:12px;}
}
@media (min-width:901px){
  .hp-nav-scrim{display:none;}
}

/* ============ admin panel ============ */
.hp-admin-warn{
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 18px;
}
.hp-admin-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;}
.hp-admin-tabs-2{margin-top:-4px;}
.hp-admin-tab{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-family:inherit;cursor:pointer;
}
.hp-admin-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.hp-admin-text{
  width:100%;min-height:320px;resize:vertical;border:1px solid var(--line);border-radius:12px;
  padding:14px;font-family:"IBM Plex Mono",Consolas,monospace;font-size:12.5px;line-height:1.6;
  background:var(--surface);color:var(--ink);box-sizing:border-box;
}
.hp-admin-actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;}
.hp-admin-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  border-radius:10px;padding:9px 16px;font-size:13px;font-family:inherit;cursor:pointer;
}
.hp-admin-btn:hover{border-color:var(--accent);color:var(--accent-ink);}
.hp-admin-btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.hp-admin-btn-primary:hover{color:#fff;filter:brightness(1.05);}
.hp-admin-btn-publish{background:var(--accent-2);border-color:var(--accent-2);color:#fff;}
.hp-admin-btn-publish:hover{color:#fff;filter:brightness(1.05);}
.hp-admin-publish-row{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0;padding-top:18px;border-top:1px dashed var(--line);}
.hp-admin-status{font-size:12.5px;margin-top:8px;min-height:16px;color:var(--ink-faint);}
.hp-admin-status-ok{color:var(--good);}
.hp-admin-status-err{color:var(--bad);}
</style>
</head>

<script id="hp-data-block" type="application/json">{"ai":{"lectures":[{"title":"الأسبوع الأول — كلود Claude: مدخل إلى الذكاء الاصطناعي التوليدي","sections":[{"h":"الأساسيات","body":"<p>كلود نموذج لغوي كبير (LLM) يتوقع الكلمة التالية بناءً على أنماط تعلّمها من نصوص هائلة — وهذا التوقّع ليس تفكيرًا بالمعنى البشري.</p><p>يمر أي طلب بأربع مراحل: <b>الأمر (Prompt)</b> — الجملة التي تكتبها للبرنامج وتوضّح فيها ما تريده بالضبط، ثم <b>التقطيع (Tokenization)</b> — تقسيم جملتك إلى قطع صغيرة يتعامل معها البرنامج، ثم <b>التمثيل الرقمي (Embeddings)</b> — تحويل كل قطعة نص إلى أرقام تقارب معناها، وأخيرًا <b>التوليد (Generation)</b>.</p><div class='hp-note'><b>الهلوسة (Hallucination):</b> افترض دائمًا أن إجابة الذكاء الاصطناعي قد تكون خاطئة حتى لو بدت مقنعة — وتحقّق من المعلومات الحساسة قبل اعتمادها.</div>"},{"h":"التعرّف على كلود","body":"<p>يُبنى كلود على مبادئ نافع، صادق وآمن، ويصدر أحكامه قبل تسليمها لك. تصل نافذة سياقه إلى نحو 500 صفحة نص في المحادثة الواحدة.</p><p>أبرز الاستخدامات: كتابة المحتوى، البحث وتحليل البيانات، البرمجة (كلود كود)، والتعلّم والتدريس.</p>"},{"h":"البداية العملية","body":"<p>يمكن الوصول إلى كلود عبر أربع طرق: تطبيق سطح المكتب (Windows وMac)، المتصفّح عبر claude.ai، وتطبيق الجوال (Android وiOS).</p><p>خطط الاشتراك: مجانية، برو (٢٠ دولارًا شهريًا)، وماكس (١٠٠ دولار شهريًا).</p>"},{"h":"شات، كوورك، وكود: شنو الفرق؟","body":"<p><b>كلود شات (Chat):</b> مهام سريعة — سؤال مباشر أو محادثة فورية.</p><p><b>كلود كوورك (Cowork):</b> مهام أكبر ووصول حقيقي لملفاتك، ويعمل بشكل متوازٍ في الخلفية.</p><p><b>كلود كود (Claude Code):</b> بيئة تطوير كاملة — قراءة الأكواد وتحسينها ومعالجة مشاكلها.</p><p>يمكن لكلود كوورك إرسال فروع مهام إلى وكلاء فرعيين مستقلين (Dispatch / Subagents) يشتغل كل منهم بمهمة منفصلة مركّزة، فتبقى المحادثة الرئيسية مركّزة على النتيجة النهائية فقط.</p>"},{"h":"هندسة الأوامر","body":"<p>القواعد الأربع لصياغة أمر ناجح: (١) تحديد الموقف والسياق، (٢) تحديد المهمة بوضوح، (٣) تحديد القواعد والشكل المطلوب، (٤) تقديم مثال.</p><p>اختيار النموذج: هايكو للسرعة، سونيت للتوازن (الافتراضي)، أوبس للدقة العالية، والتفكير الممتد (Extended thinking) عند الحاجة لتحليل أعمق.</p><div class='hp-note'><b>عقلية التكرار</b> أفضل من «عقلية اللقطة الواحدة»: ابنِ السياق تدريجيًا وقدّم ملاحظات وتصحيحات واضحة بعد كل نتيجة، بدل توقّع إجابة كاملة من أمر واحد.</div>"},{"h":"المشاريع والملحقات والمهارات","body":"<p><b>المشاريع (Projects):</b> بيئة معزولة بذاكرة ومعلومات وملفات ثابتة لكل موضوع تتعامل معه بانتظام.</p><p><b>الأرتيفاكتس (Artifacts):</b> نافذة تفاعلية مستقلة لعرض النتائج الكبيرة أو المواقع أو المستندات الطويلة، ومشاركتها برابط.</p><p><b>المهارات (Skills):</b> أسلوب عمل قابل لإعادة الاستخدام — جاهز من Anthropic أو مصمم خصيصًا لك.</p>"}],"terms":[["نموذج لغوي كبير (LLM)","برنامج «قرأ» كمية هائلة من النصوص ويتوقع الكلمة التالية المناسبة، من دون أن «يفهم» بالمعنى الإنساني."],["الأمر / الطلب (Prompt)","الجملة التي تكتبها للبرنامج توضّح فيها ما تريد بالضبط."],["التقطيع (Tokenization)","تقسيم جملتك إلى قطع صغيرة يتعامل معها البرنامج."],["التمثيل الرقمي (Embeddings)","تحويل كل قطعة نص إلى أرقام تقارب معناها."],["نافذة السياق (Context Window)","كمية النص التي يقدر البرنامج يتذكرها بنفس المحادثة."],["الهلوسة / الاختلاق (Hallucination)","إعطاء معلومة غير دقيقة بثقة تامة وكأنها صحيحة."],["شات / كوورك / كود","محادثة سريعة، أو تنفيذ مهام أكبر باللمّات، أو أداة برمجة كاملة الوظيفة."]]},{"title":"الأسبوع الثاني — جولة داخل كلود: الواجهات والإعدادات","sections":[{"h":"واجهات الاستخدام","body":"<p><b>Chat:</b> محادثة جديدة، أرشيف كل نقاشاتك السابقة قابل للبحث، ورفع الملفات والصور والمحادثة الصوتية.</p><p><b>Projects:</b> ساحة محفوظة لمعلومات وملفات ثابتة لموضوع معيّن — تعليمات دائمة، ملفات مرجعية، ومحادثات ضمن سياق المشروع.</p><p><b>Artifacts:</b> ناتجة تفاعلية تُنتج نتيجة واحدة تعرض نفسك.</p><p><b>Cowork:</b> إدارة مهام (Working، Needs input، Ready for review، Completed، Archived) ووصول لملفاتك، والأجهزة الموثوقة والمتصفح المفضّل.</p><p><b>Dispatch:</b> إرسال مهمة لفرع مستقل ينفذ عنها بعيدًا ثم تُصوَّر عنك النتيجة.</p><p><b>المهام المجدولة (Scheduled runs):</b> مهام تعمل تلقائيًا في وقت محدد — تفعيل، سجل تنفيذات، وإيقاف.</p>"},{"h":"الإعدادات من الهاتف","body":"<p><b>Profile:</b> اسمك وطبيعة عملك والتعليمات الدائمة.</p><p><b>Billing / Usage:</b> رصيدك وفواتيرك، مع إمكانية تفعيل إعادة التمحون التلقائي (Auto-reload).</p><p><b>Capabilities:</b> تفعيل وإطفاء مزايا كلود نفسها — Artifacts، الرسوم داخل المحادثة، وتنفيذ الأكواد وإنشاء الملفات.</p><p><b>Connectors:</b> الحسابات المرتبطة مثل Drive والبريد والتقويم.</p><p><b>Claude Code / Cowork:</b> تصنيف حالة الجلسة، تبديل النموذج عند الحاجة، ألوان مظهر الكود، طلب أجهزة موثوقة، والتنفيذ المحلي فقط (Only on your computer) بدل السحابة.</p>"},{"h":"الحوكمة والاستخدام الآمن","body":"<p><b>تصنيف البيانات:</b> عام، داخلي، سرّي — ولكل تصنيف قواعد تعامل مختلفة.</p><p><b>البيانات الشخصية المحمية (PII):</b> إخفاء الهوية (Anonymization) قبل رفع أي بيانات تخص أشخاصًا محددين.</p><p><b>الإشراف البشري (Human in the loop):</b> المسؤولية والتوقيع والتحقق تبقى بشرية قبل اعتماد أي نتيجة.</p><p><b>سياسة استخدام موسّعة:</b> من يستخدم؟ لأي غرض؟ وبأي صلاحية؟</p>"}],"terms":[["Cowork","واجهة إدارة المهام الكبيرة التي تصل لملفاتك وتعمل بالخلفية."],["Dispatch","إرسال مهمة تُنفَّذ بعيدًا ثم تُعرض عليك نتيجتها."],["Session (الجلسة)","نافذة عمل مستقلة لها سياقها وحالتها الخاصة."],["Needs input","حالة مهمة متوقفة بانتظار قرار منك."],["Ready for review","المهمة أُنجزت وتنتظر مراجعة اعتمادك."],["Scheduled runs (المهام المجدولة)","مهام تعمل تلقائيًا في مواعيد محدَّدة."],["Trigger (المشغّل)","الشرط أو الموعد الذي يُطلِق المهمة المجدولة."],["Capabilities (القدرات)","مزايا كلود التي تُفعَّل أو تُطفَأ من الإعدادات."],["Connectors (الموصلات)","الحسابات الخارجية المرتبطة مثل Drive والبريد والتقويم."],["Trusted devices (الأجهزة الموثوقة)","أجهزة تم التحقق منها قبل السماح لها بالوصول لملفاتك."],["Active sessions (الجلسات النشطة)","كل جهاز مفتوح حاليًا على حسابك مع موقعه وتاريخه."],["Export data (تصدير البيانات)","تنزيل أرشيف كامل لمحاوراتك ومشاريعك."],["Auto-reload (إعادة التمحون التلقائي)","شراء رصيد استخدام تلقائيًا عند اقترابه من النفاد."],["Skills (المهارات)","أسلوب عمل جاهز تُخبِر كلود عند الحاجة تشغيله أو تنشرها بنفسك."]]}],"summary":[{"h":"الأسبوع الأول — الأساسيات","items":["كلود نموذج لغوي كبير يتوقّع الكلمة التالية بناءً على أنماط تعلّمها — لا يفكّر كالإنسان.","رحلة الأمر: Prompt ← Tokenization ← Embeddings ← Generation.","افترض دائمًا احتمال «الهلوسة» وتحقّق من أي معلومة حسّاسة قبل اعتمادها.","أربع طرق للوصول: كلود كود (برمجة)، كلود كوورك (مهام كبيرة وملفات)، المتصفح، وتطبيق الجوال.","القواعد الأربع لأمر ناجح: الموقف، المهمة، الشكل، ثم مثال.","هايكو للسرعة، سونيت للتوازن، أوبس للدقة، والتفكير الممتد للتحليل العميق.","عقلية التكرار (بناء تدريجي بالملاحظات) أفضل من انتظار نتيجة كاملة من أمر واحد."]},{"h":"الأسبوع الثاني — الواجهات والإعدادات","items":["Chat لمهمة سريعة، Projects لموضوع متكرر بذاكرة دائمة، Artifacts لنتيجة تفاعلية مستقلة.","Cowork يدير مهامًا أكبر عبر حالات: Working، Needs input، Ready for review، Completed، Archived.","Dispatch يفوّض جزءًا من المهمة لفرع مستقل يعمل بالخلفية.","المهام المجدولة (Scheduled runs) تنفّذ تلقائيًا حسب موعد محدَّد ولها سجل تنفيذات.","الإعدادات الأساسية: Profile، Billing/Usage، Capabilities، Connectors، Skills.","الحوكمة: تصنيف البيانات (عام/داخلي/سرّي)، إخفاء هوية البيانات الشخصية PII، وإبقاء الإشراف البشري قبل أي اعتماد.","مراجعة الجلسات النشطة (Active sessions) دوريًا إجراء أمني ضروري."]}],"exercises":[{"lvl":"بسيط","t":"تعليماتك الشخصية الدائمة","b":"اكتب نصًا لا يتجاوز خمسة أسطر يعرّف بك: موقعك الوظيفي، وطبيعة عملك، وأسلوب الرد الذي تفضّله. ضعه في الإعدادات، ثم اطرح السؤال نفسه قبل إضافته وبعدها وقارن الفرق.","deliver":"نص التعليمات + الجوابان قبل وبعد، مع سطر يوضّح الفرق الذي لاحظته.","model":"<h5>نموذج مُنفَّذ</h5><p><b>١) نص التعليمات الدائمة (خمسة أسطر):</b></p><div class='hp-sample'>أنا مهندس في قسم المسوحات بدائرة حكومية، وأكثر عملي تقارير فنية ومراسلات رسمية داخلية.<br>ابدأ الإجابة بالخلاصة في سطرين، ثم فصّل تحتها بنقاط.<br>اكتب بالعربية الفصحى بأسلوب إداري رسمي موجز، بلا عبارات مجاملة أو مبالغة.<br>عند ذكر أي رقم أو مرجع، بيّن مصدره ونبّهني صراحةً إن كان تقديريًا.<br>إذا نقصك سياق ضروري، اسألني سؤالًا واحدًا محدّدًا بدل الافتراض.</div><p><b>٢) السؤال المختبَر:</b> «اكتب لي ردًا على كتاب استفسار عن تأخّر إنجاز مسح ميداني».</p><p><b>قبل التعليمات:</b> نص عام طويل، بنبرة تسويقية، يخاطب «العميل الكريم»، بلا هيكل واضح ولا إشارة إلى الصفة الرسمية.</p><p><b>بعد التعليمات:</b> ردّ رسمي من ثلاث فقرات: الإحاطة، ثم سبب التأخير، ثم الموعد المقترح — يبدأ بخلاصة سطرين، وسأل سؤالًا واحدًا عن رقم الكتاب الوارد بدل اختراعه.</p><p><b>٣) الفرق الملاحَظ:</b> اختفت المجاملات وظهر الهيكل الثابت، وأهمّ من ذلك أن النموذج صار يسأل عند نقص المعلومة بدل أن يخترعها — وهذا وحده يقلّل خطر الهلوسة في المراسلات.</p><div class='hp-crit'><b>معايير التقييم:</b> خمسة أسطر أو أقل · تغطية الهوية الوظيفية والأسلوب والنبرة · وجود قاعدة تخصّ التعامل مع الأرقام أو نقص المعلومة · مقارنة حقيقية لجوابين على السؤال نفسه لا وصف عام للفرق.</div>"},{"lvl":"بسيط","t":"قارن بين الأنماط","b":"اطرح سؤالًا واحدًا وجرّب ثلاثة أنماط ردّ بارزة: العادي، الموجز، والتفسيري. سجّل في جدول من ثلاثة صفوف: النمط، طول الجواب تقريبًا، ومتى تستخدمه في عملك.","deliver":"جدول من ثلاثة صفوف: النمط · طول الجواب تقريبًا · متى تستخدمه في عملك.","model":"<h5>نموذج مُنفَّذ</h5><p><b>السؤال الموحّد:</b> «ما الفرق بين المسح التفصيلي والمسح الاستطلاعي، وأيّهما يلزم لمشروع طريق داخلي؟»</p><div class='hp-cmp-wrap'><table class='hp-cmp'><tr><th>النمط</th><th>طول الجواب تقريبًا</th><th>متى تستخدمه في عملك</th></tr><tr><td>العادي</td><td>٢٠٠–٣٠٠ كلمة، فقرتان مع أمثلة</td><td>الاستخدام اليومي: صياغة مذكّرة أو ردّ على استفسار فني معتاد.</td></tr><tr><td>الموجز</td><td>٥٠–٨٠ كلمة، نقاط مختصرة</td><td>حين تريد جوابًا سريعًا على الهاتف أو معلومة تُقحَم في اجتماع جارٍ.</td></tr><tr><td>التفسيري</td><td>٥٠٠ كلمة فأكثر، مع تفصيل الأسباب والبدائل</td><td>عند إعداد مادة تدريبية، أو تبرير قرار فني أمام لجنة، أو شرح لموظف جديد.</td></tr></table></div><p><b>الخلاصة المستخلصة:</b> النمط ليس مسألة ذوق بل مسألة سياق استعمال. الموجز يوفّر الوقت لكنه يُسقط التحفّظات والاستثناءات، والتفسيري يحميك أمام اللجان لكنه مُرهِق في المراسلة اليومية.</p><div class='hp-crit'><b>معايير التقييم:</b> السؤال نفسه في الأنماط الثلاثة · تقدير طول واقعي لا رقم اعتباطي · ربط كل نمط بموقف عمل محدّد لا بعبارة عامة · جملة خلاصة تبيّن ما تعلّمته من المقارنة.</div>"},{"lvl":"بسيط","t":"أصلح أمرًا ضعيفًا","b":"خذ الأمر الضعيف «اكتب لي تقرير» وأعد صياغته وفق القواعد الأربع: الموقف، المهمة، الشكل، ثم مثال.","deliver":"الأمر قبل وبعد، والجوابان، مع تحديد أي قاعدة أحدثت أكبر فرق.","model":"<h5>نموذج مُنفَّذ</h5><p><b>الأمر قبل:</b> «اكتب لي تقرير».</p><p><b>الأمر بعد إعادة الصياغة:</b></p><div class='hp-sample'><b>الموقف والسياق:</b> أنا مسؤول شعبة المسوحات، وأكتب تقريرًا شهريًا يُرفع إلى مدير القسم ويُعرض في اجتماع الإدارة.<br><b>المهمة:</b> اكتب تقرير شهر آب عن سير العمل بالاعتماد على المعطيات التالية: أُنجزت ١٤ مهمة مسح من أصل ١٨، وتأخّرت ٤ بسبب أعطال أجهزة، وتمّ استلام جهازين جديدين بتاريخ ٢٠ آب.<br><b>القواعد والشكل:</b> صفحة واحدة، أربعة عناوين فرعية (الإنجاز · المعوّقات · الإجراءات المتّخذة · التوصيات)، لغة رسمية موجزة، بلا عبارات مبالغة، ولا تضف أي رقم لم أذكره.<br><b>المثال:</b> اتبع أسلوب التقرير المرفق لشهر تموز في ترتيب العناوين ونبرة الصياغة.</div><p><b>الجواب قبل:</b> قالب إنشائي عام عن «أهمية التقارير»، بلا أرقام ولا عناوين، صالح لأي دائرة في العالم — أي غير صالح لأي دائرة.</p><p><b>الجواب بعد:</b> تقرير بصفحة واحدة بالعناوين الأربعة، مبني على الأرقام المعطاة حصرًا، ونبرة مطابقة لتقرير تموز، وجاهز للرفع بعد مراجعة بسيطة.</p><p><b>القاعدة صاحبة الأثر الأكبر:</b> <mark class='hp-hl'>تحديد الموقف والسياق</mark>، لأنها هي التي حدّدت من يكتب ولمن، فتغيّرت النبرة ومستوى التفصيل تلقائيًا. وتليها في الأثر «القواعد والشكل» لأنها منعت الاستطراد وقيّدت النموذج بالأرقام المعطاة فقط، وهذا هو الحاجز العملي أمام الهلوسة.</p><div class='hp-crit'><b>معايير التقييم:</b> ظهور القواعد الأربع صراحةً في الأمر الجديد · وجود معطيات حقيقية لا فراغات · قيد صريح يمنع إضافة أرقام من عند النموذج · تحديد قاعدة واحدة بعينها مع تبرير الاختيار لا مجرد ذكرها.</div>"},{"lvl":"متوسط","t":"أنشئ مشروعًا لمهمة متكررة","b":"اختر مهمة تتكرر عليك في دائرتك، وأنشئ لها مشروعًا (Project) بتعليمات ثابتة وملفّين مرجعيّين على الأقل.","deliver":"اسم المشروع + نص التعليمات + قائمة الملفات + مثال واحد لناتج خرج منه.","model":"<h5>نموذج مُنفَّذ</h5><p><b>اسم المشروع:</b> «مراسلات شعبة المسوحات».</p><p><b>نص التعليمات الثابتة:</b></p><div class='hp-sample'>هذا المشروع مخصّص لصياغة الكتب الرسمية الصادرة عن شعبة المسوحات إلى الأقسام الأخرى.<br>كل كتاب: ثلاث فقرات كحدّ أقصى — الإحاطة، ثم الموضوع، ثم المطلوب والموعد.<br>اعتمد المصطلحات الفنية كما وردت في دليل المصطلحات المرفق، ولا تستبدلها بمرادفات.<br>لا تُدرج أي رقم معاملة أو تاريخ لم أزوّدك به، واترك مكانه قوسًا هكذا: (رقم الكتاب).<br>انهِ كل كتاب بصيغة الختام المعتمدة في نماذج الكتب المرفقة.</div><p><b>الملفات المرجعية (قاعدة المعرفة):</b></p><ol><li>نماذج كتب رسمية معتمدة سابقة (٥ كتب) — لتثبيت الأسلوب والختام.</li><li>دليل المصطلحات الفنية للمسوحات — لتوحيد المفردة.</li><li>التعميم الإداري الخاص بمواعيد الردّ على المخاطبات — لضبط الموعد المذكور في الكتب.</li></ol><p><b>مثال لناتج خرج من المشروع:</b> كتاب موجّه إلى قسم الحاسبة يطلب تزويد الشعبة ببيانات إحداثيات محطة الرصد، صيغ في ثلاث فقرات، بالمصطلحات المعتمدة، وترك موضع رقم الكتاب فارغًا بقوس بدل اختراعه، وأُنجز في أقل من دقيقتين بدل الصياغة اليدوية المعتادة.</p><p><b>الضوابط المطبَّقة:</b> لم تُرفع أي بيانات مصنّفة سرّية، والكتب تُراجع وتُوقَّع بشريًا قبل الصدور.</p><div class='hp-crit'><b>معايير التقييم:</b> مهمة متكرّرة حقيقية لا افتراضية · تعليمات مكتوبة كقواعد قابلة للتطبيق لا كوصف عام · ملفّان مرجعيان فأكثر مع تبرير وجود كل ملف · ناتج فعلي مرفق · إشارة إلى تصنيف البيانات والمراجعة البشرية.</div>"},{"lvl":"متوسط","t":"تحليل بيانات مصغّر","b":"جهّز جدولًا لا يقلّ عن عشرين صفًا من بيانات غير سرّية أو مخفاة الهوية، ثم استخرج منه ثلاثة مؤشرات ورسمًا بيانيًا واحدًا.","deliver":"الجدول + المؤشّرات الثلاثة + الرسم + جملة تشرح كيف تحقّقت من صحة الأرقام.","model":"<h5>نموذج مُنفَّذ</h5><p><b>البيانات:</b> جدول من ٢٤ صفًا لمعاملات واردة خلال شهر، بأعمدة: الرقم التسلسلي · نوع المعاملة · تاريخ الورود · تاريخ الإنجاز · الجهة المنفّذة.</p><p><b>خطوة إخفاء الهوية (قبل الرفع):</b> حُذف عمودا اسم المواطن ورقم الهاتف نهائيًا، واستُبدل بالرقم التسلسلي فقط، فلم يبقَ في الملف ما يدلّ على شخص بعينه.</p><p><b>المؤشّرات الثلاثة المستخرَجة:</b></p><div class='hp-cmp-wrap'><table class='hp-cmp'><tr><th>المؤشّر</th><th>القيمة</th><th>ما يعنيه إداريًا</th></tr><tr><td>متوسط زمن الإنجاز</td><td>٦٫٤ يوم</td><td>مقارنته بالسقف المحدّد في التعميم (٥ أيام) تكشف تجاوزًا بسيطًا يحتاج معالجة.</td></tr><tr><td>نسبة المعاملات المتأخّرة</td><td>٢٩٪ (٧ من ٢٤)</td><td>ثلثها تقريبًا متأخّر — رقم يستدعي تحليل السبب لا مجرد التنبيه.</td></tr><tr><td>أكثر نوع معاملة تكرارًا</td><td>«تصديق مخطط» ٩ معاملات</td><td>أولوية أولى لأي تبسيط إجراءات أو أتمتة.</td></tr></table></div><p><b>الرسم البياني:</b> رسم أعمدة يقارن عدد المعاملات في كل نوع، مع خط أفقي يمثّل السقف الزمني المعتمد — أُنتج داخل أرتيفاكت وحُفظ بصيغة صورة للتقرير.</p><p><b>كيف تحقّقت من صحة الأرقام:</b> أعدت حساب متوسط زمن الإنجاز يدويًا على عيّنة من ٦ صفوف وطابقته بالنتيجة، وجمعت أعداد الأنواع للتأكّد أن مجموعها ٢٤ صفًا بالضبط لا أكثر ولا أقل. أي فرق في المجموع كان سيعني أن النموذج أسقط صفوفًا أو كرّرها.</p><div class='hp-crit'><b>معايير التقييم:</b> عشرون صفًا فأكثر · إثبات خطوة إخفاء الهوية · مؤشّرات مفيدة إداريًا لا حسابية فقط · رسم واحد مناسب لنوع البيانات · طريقة تحقّق قابلة للتكرار (إعادة حساب عيّنة + مطابقة المجاميع) لا عبارة «تأكّدت من الأرقام».</div>"},{"lvl":"متوسط","t":"اضبط مهمة مجدولة","b":"اختر عملًا أسبوعيًا متكررًا في عملك، واضبط له مهمة مجدولة واحدة تُنفَّذ في وقت محدَّد، ثم افحص نتيجتها وسجل الفروقات.","deliver":"وصف المهمة + وقت التشغيل + دليل من سجلّ التنفيذات + تقييمك لدقّة الناتج.","model":"<h5>نموذج مُنفَّذ</h5><p><b>وصف المهمة:</b> «اقرأ ملف متابعة المعاملات في مجلّد الشعبة، واستخرج المعاملات التي تجاوزت خمسة أيام دون إنجاز، ثم أرسل لي جدولًا بها مرتّبًا من الأقدم إلى الأحدث، مع سطر واحد يذكر عددها الكلي».</p><p><b>وقت التشغيل والمشغّل:</b> كل يوم أحد الساعة ٧:٣٠ صباحًا — أي قبل بدء الدوام بنصف ساعة ليكون الجدول جاهزًا على المكتب.</p><p><b>البنية المساندة:</b> المهمة مربوطة بمشروع «متابعة المعاملات» ليأخذ تعليمات الشكل الثابتة منه، وبموصل إلى مجلّد الملفات ليقرأ آخر نسخة من الملف تلقائيًا.</p><p><b>دليل من سجلّ التنفيذات:</b></p><div class='hp-sample'>✅ تشغيلة ناجحة — الأحد ٧:٣٠ — أُنتج جدول بـ ٧ معاملات متأخّرة.<br>✅ تشغيلة ناجحة — الأحد التالي ٧:٣٠ — أُنتج جدول بـ ٤ معاملات متأخّرة.<br>⚠️ ملاحظة: التشغيلة الثالثة تأخّرت لأن الملف كان مفتوحًا للتحرير وقت القراءة.</div><p><b>تقييم دقّة الناتج:</b> طابقتُ الجدول الناتج بالملف الأصلي في أول تشغيلتين فتطابق العدد تمامًا. لكن ظهرت مشكلة واحدة: المعاملات المؤجّلة بقرار إداري كانت تُحتسب متأخّرة، فعدّلت الوصف بإضافة قيد: «استثنِ الصفوف التي في عمود الحالة كلمة مؤجّلة». هذا يبيّن أن المهمة المجدولة تحتاج ضبطًا بعد أول تشغيلة لا قبلها.</p><p><b>الأثر:</b> اختفى عمل يدوي مقداره نحو ٢٠ دقيقة أسبوعيًا، وتحوّل دوري من استخراج القائمة إلى اتخاذ قرار بشأنها.</p><div class='hp-crit'><b>معايير التقييم:</b> مهمة قابلة للأتمتة فعلًا · وقت تشغيل مبرَّر لا اعتباطي · دليل من السجلّ لا ادّعاء · تقييم يذكر خطأً واحدًا على الأقل وكيف عُولج · إشارة إلى بقاء القرار بيد الموظف.</div>"},{"lvl":"متقدم","t":"سياسة استخدام مصغّرة للقسم","b":"اكتب وثيقة من صفحة واحدة تجيب عن أربعة أسئلة: من يستخدم كلود؟ في أي مهام تحديدًا؟ ما الذي يُمنع رفعه من بيانات؟ ومن يعتمد المخرجات قبل خروجها من الدائرة؟","deliver":"وثيقة صفحة واحدة، مكتوبة بصيغة قابلة للاعتماد الرسمي لا كمسوّدة نقاش.","model":"<h5>نموذج مُنفَّذ — وثيقة صفحة واحدة</h5><div class='hp-sample'><b>سياسة استخدام أدوات الذكاء الاصطناعي في شعبة المسوحات</b><br><br><b>أولًا — من يستخدم:</b> يقتصر الاستخدام على منتسبي الشعبة المصرّح لهم بقرار من مدير القسم، عبر حسابات عمل رسمية حصرًا، ويُمنع استخدام الحسابات الشخصية في أي عمل يخصّ الدائرة.<br><br><b>ثانيًا — في أي مهام:</b> صياغة المراسلات والتقارير الداخلية، وتلخيص المحاضر والوثائق غير المصنّفة، وتنظيم البيانات وتحليلها بعد إخفاء الهوية، وإعداد المواد التدريبية. ويُمنع استخدامها في إصدار أي قرار إداري أو فني بصورة مباشرة.<br><br><b>ثالثًا — ما يُمنع رفعه منعًا باتًا:</b> البيانات المصنّفة سرّية أو خاصة بأمن المنشآت، والبيانات الشخصية للمواطنين أو المنتسبين (الأسماء، أرقام الهواتف، العناوين، أرقام الهوية)، والمستندات ذات الأثر القانوني قبل صدورها، وأي إحداثيات أو مخطّطات تخضع لقيد أمني. وعند الحاجة للتحليل تُخفى الهوية أولًا وتُحذف الحقول الدالّة.<br><br><b>رابعًا — من يعتمد المخرجات:</b> لا يخرج أي مُخرَج من الشعبة قبل مراجعة الموظف المختصّ وتوقيع رئيس الشعبة. المسؤولية عن دقة المضمون تقع على الموقِّع لا على الأداة، ويُلزم بالتحقّق من كل رقم أو مرجع من مصدره الأصلي.<br><br><b>خامسًا — الضبط التقني:</b> تفعيل «طلب أجهزة موثوقة»، ومراجعة الجلسات النشطة شهريًا، وربط الموصلات بحسابات العمل فقط، وضبط حدود الاستخدام والفوترة بسقف معلوم.<br><br><b>سادسًا — المخالفات:</b> يُعدّ رفع بيانات ممنوعة مخالفة لتعليمات حماية المعلومات، وتُعالج وفق السياقات الإدارية المعتمدة.</div><div class='hp-crit'><b>معايير التقييم:</b> الإجابة على الأسئلة الأربعة كلها بلا مواربة · صياغة آمرة قابلة للاعتماد لا صياغة نقاشية · قائمة ممنوعات محدّدة لا عبارة «البيانات الحساسة» · تسمية جهة الاعتماد بالمنصب · وجود بند للضبط التقني وبند للمخالفات · ألّا تتجاوز صفحة واحدة.</div>"}],"quiz":{"mcq":[{"w":1,"q":"النموذج اللغوي الكبير (LLM) يعمل بشكل أساسي عن طريق:","opts":["فهم النص فهمًا بشريًا حقيقيًا","توقّع الكلمة التالية بناءً على أنماط تعلّمها من نصوص سابقة","البحث في الإنترنت لحظيًا عن كل إجابة","حفظ كل إجابة سبق أن أعطاها لأي مستخدم"],"correct":1,"explain":"النموذج لا يفهم ولا يبحث لحظيًا؛ هو يتوقّع الكلمة الأنسب التالية اعتمادًا على أنماط إحصائية تعلّمها من نصوص التدريب، لذلك تكون مخرجاته مقنعة الصياغة حتى حين تكون خاطئة المضمون."},{"w":1,"q":"«الهلوسة» (Hallucination) في الذكاء الاصطناعي تعني:","opts":["توقف البرنامج عن العمل فجأة","إعطاء إجابة خاطئة بثقة تامة وكأنها صحيحة","طلب البرنامج توضيحًا إضافيًا من المستخدم","رفض البرنامج الإجابة على سؤال معيّن"],"correct":1,"explain":"الهلوسة خطأ في المضمون لا في الشكل: معلومة مختلَقة تُقدَّم بلغة واثقة، والعلاج التحقق من كل معلومة حساسة من مصدر موثوق قبل اعتمادها."},{"w":1,"q":"أي أداة من أدوات كلود الأنسب لتنظيم ملفاتك وجدولة مهام تتكرر يوميًا تلقائيًا؟","opts":["كلود شات (Chat)","كلود كوورك (Cowork)","كلود كود (Claude Code)","كلها بنفس القدرة"],"correct":1,"explain":"كوورك واجهة المهام الكبيرة: وصول حقيقي للملفات، عمل بالخلفية، وجدولة تلقائية؛ الشات للمهام السريعة، والكود للعمل البرمجي."},{"w":1,"q":"حسب «القواعد الذهبية الأربع» لكتابة أمر ناجح، أول خطوة هي:","opts":["تقديم مثال","تحديد شكل الإجابة المطلوبة","تحديد الموقف والسياق","تحديد طول الإجابة فقط"],"correct":2,"explain":"الترتيب: الموقف والسياق ← المهمة بوضوح ← القواعد والشكل ← تقديم مثال. السياق أولًا لأنه يحدّد من أنت ولمن تكتب."},{"w":1,"q":"أي نموذج من نماذج كلود هو «الافتراضي» المتوازن لمعظم المهام اليومية؟","opts":["هايكو (Haiku)","سونيت (Sonnet)","أوبس (Opus)","لا فرق بين النماذج"],"correct":1,"explain":"هايكو للسرعة، وأوبس للدقة العالية في المهام المعقدة، وسونيت هو التوازن بينهما والخيار الافتراضي لأغلب الأعمال اليومية."},{"w":2,"q":"مهمة في Cowork حالتها «تحتاج ردك» (Needs input) تعني:","opts":["أنها فشلت ويجب حذفها","أنها متوقفة بانتظار قرار منك لتكمل","أنها اكتملت واعتُمدت","أنها مؤرشفة"],"correct":1,"explain":"هذه الحالة تعني أن كلود وصل إلى نقطة تحتاج قرارًا بشريًا — أول ما تراجعه في يومك لأنها تعطّل بقية سلسلة العمل."},{"w":2,"q":"إعداد «طلب أجهزة موثوقة» (Require trusted devices) وظيفته:","opts":["تسريع فتح التطبيق","التحقق من كل جهاز جديد قبل السماح له ببدء جلسة تصل لملفاتك","تغيير لون الواجهة","زيادة رصيد الاستخدام"],"correct":1,"explain":"إعداد أمني بالدرجة الأولى يمنع أي جهاز غير معتمد من بدء جلسة تصل إلى ملفاتك — يُبقى مفعّلًا دائمًا في بيئة العمل الرسمي."},{"w":2,"q":"رابط تصدير البيانات (Export data) يصلك:","opts":["على بريدك الإلكتروني ويظل صالحًا ٢٤ ساعة","داخل المحادثة ويبقى دائمًا","برسالة نصية على هاتفك","لا يمكن تصدير البيانات إطلاقًا"],"correct":0,"explain":"التصدير يصلك رابط تنزيل على البريد بصلاحية ٢٤ ساعة فقط، لأن الأرشيف يحوي محادثاتك ومشاريعك كاملة."},{"w":2,"q":"أي خيار في «المهارات» هو الأنسب لموظف مبتدئ يريد بناء مهارة أول مرة؟","opts":["Upload skill","Create a skill","Create with Claude","Browse فقط"],"correct":2,"explain":"Create with Claude يبني المهارة بالحوار: تصفها بالكلام فيسألك أسئلة قليلة ثم يولّدها؛ أما Create a skill فيتطلب كتابتها من الصفر."},{"w":2,"q":"«إعادة الشحن التلقائي» (Auto-reload) في الفوترة تعني:","opts":["إعادة تحميل الصفحة تلقائيًا","شراء أرصدة استخدام تلقائيًا عند اقتراب رصيدك من النفاد","حفظ المحادثات تلقائيًا","تحديث التطبيق تلقائيًا"],"correct":1,"explain":"ميزة تمنع توقف العمل عند نفاد الرصيد، لكنها تصرف مالًا بلا استئذان في كل مرة، لذلك تُفعَّل بوعي بالكلفة وسقف معلوم."}],"tf":[{"w":1,"s":"النموذج اللغوي الكبير «يفكّر» بنفس طريقة تفكير الإنسان.","correct":false,"explain":"هو يتوقّع الكلمة التالية إحصائيًا؛ التشابه في الشكل اللغوي لا يعني تشابهًا في آلية التفكير."},{"w":1,"s":"يجب دائمًا التحقق من المعلومات الحساسة التي يقدّمها الذكاء الاصطناعي من مصدر موثوق.","correct":true,"explain":"هذه القاعدة الأولى في التعامل الآمن مع الأداة، وهي الحاجز الوحيد أمام أثر الهلوسة."},{"w":1,"s":"«التفكير الممتد» يُفضَّل تفعيله لكل سؤال لأنه لا يُكلّف شيئًا إضافيًا.","correct":false,"explain":"التفكير الممتد يستهلك وقتًا ورصيدًا أكبر، فيُستعمل للمهام المعقدة التي تستحقّه لا لكل سؤال."},{"w":1,"s":"نافذة السياق الكبيرة تعني أن كلود يتذكّر كل شيء للأبد حتى بعد إغلاق المحادثة.","correct":false,"explain":"نافذة السياق تخصّ المحادثة الواحدة ولها حدّ؛ الاستمرارية عبر الجلسات تأتي من المشاريع والتعليمات الدائمة لا من النافذة."},{"w":1,"s":"الإرسال إلى وكلاء فرعيين (Dispatch) يساعد على إبقاء المحادثة الأساسية مركّزة.","correct":true,"explain":"الوكيل الفرعي ينفّذ البحث والاستكشاف بعيدًا ويعيد النتيجة النهائية فقط، فلا تتضخّم المحادثة الأساسية بالتفاصيل."},{"w":2,"s":"«ديسباتش» و«كوورك» واجهتان مستقلتان في الشريط الجانبي.","correct":true,"explain":"كل منهما مدخل قائم بذاته: كوورك للمهام الكبيرة على ملفاتك، وديسباتش لإرسال مهمة تُنفَّذ بعيدًا وتعود بنتيجتها."},{"w":2,"s":"المهمة المؤرشفة تُحذف نهائيًا ولا يمكن استرجاعها.","correct":false,"explain":"الأرشفة إخفاء من القائمة النشطة فقط، والمهمة تبقى قابلة للرجوع إليها؛ الحذف إجراء آخر مختلف."},{"w":2,"s":"تصنيف حالة الجلسة تلقائيًا يُحسب من رصيد استخدام خطتك.","correct":true,"explain":"التصنيف التلقائي عملية يقوم بها النموذج ولها كلفة تُحتسب من رصيدك، لذلك يمكن إطفاؤه إن لم تكن بحاجته."},{"w":2,"s":"مراجعة الجلسات النشطة إجراء أمني ينبغي تكراره دوريًا.","correct":true,"explain":"أي جهاز أو موقع لا تعرفه في القائمة يعني حسابًا مفتوحًا في مكان لا تريده، وكشفه المبكر يقلّل الضرر."},{"w":2,"s":"تفعيل إعدادات الخصوصية يبيح رفع البيانات السرّية للدائرة.","correct":false,"explain":"الإعدادات تقلّل مخاطر الاستخدام اللاحق للبيانات، لكنها لا تغيّر تصنيف البيانات نفسه؛ ما هو سرّي لا يُرفع أصلًا."}],"scenario":[{"w":1,"q":"موظف بدائرتك كتب لكلود: «اكتب لي كتابًا رسميًا» بدون أي تفاصيل أخرى، وحصل على نتيجة عامة لا تناسب طبيعة عمله. ما الخطأ هنا، وكيف يصححه؟","points":[{"t":"تشخيص الخطأ: أمر عام يفتقر إلى السياق والمعطيات، فأنتج نصًا عامًا بالضرورة.","k":["غموض","السياق","عام","تفاصيل","معطيات","ناقص"]},{"t":"القاعدة الأولى — الموقف والسياق: يحدّد موقعه الوظيفي واسم الدائرة والجهة المُرسَل إليها.","k":["الموقف","السياق","الدائرة","الوظيفي","الجهة"]},{"t":"القاعدة الثانية — المهمة بوضوح: يعطي المعطيات الفعلية (رقم المعاملة، السبب، الموعد الجديد).","k":["المهمة","المعاملة","السبب","الموعد","المعطيات","الرقم"]},{"t":"القاعدة الثالثة — القواعد والشكل: كتاب رسمي بثلاث فقرات، بلا عبارات مبالغة، وبطول محدّد.","k":["الشكل","فقرات","رسمي","القواعد","مبالغة","الطول","التنسيق"]},{"t":"القاعدة الرابعة — تقديم مثال: يرفق نموذج كتاب سابق معتمد ليقلّد أسلوبه.","k":["مثال","نموذج","سابق","يرفق"]},{"t":"تثبيت الأسلوب مستقبلًا في التعليمات الدائمة أو داخل مشروع، ومراجعة النص قبل التوقيع.","k":["التعليمات الدائمة","مشروع","المراجعة","التوقيع"]}]},{"w":1,"q":"مدير يستخدم كلود لتلخيص تقرير طويل، وبعد ٤٠ دقيقة لاحظ أن الإجابات بدأت تفقد دقتها وتتجاهل تفاصيل ذكرها بالبداية. ما تفسير هذا، وما الإجراء المناسب؟","points":[{"t":"التفسير: نافذة السياق محدودة، وفي المحادثات الطويلة يفقد النموذج تدريجيًا تفاصيل بدايتها.","k":["نافذة","السياق","محدود","يفقد","البداية","طويلة"]},{"t":"إعادة تثبيت المعطيات: تلخيص النقاط والقرارات المهمة في رسالة جديدة داخل المحادثة.","k":["تلخيص","تثبيت","إعادة","النقاط","تذكير"]},{"t":"بدء محادثة جديدة أو مشروع يحمل الخلاصة والملفات المرجعية بدل الاستمرار في محادثة متضخّمة.","k":["محادثة جديدة","مشروع","ملف"]},{"t":"تقسيم التقرير إلى أجزاء ومعالجة كل جزء على حدة ثم دمج الملخّصات.","k":["تقسيم","أجزاء","جزء","مراحل"]},{"t":"التحقق من التفاصيل الحساسة بمطابقتها بالتقرير الأصلي قبل الاعتماد.","k":["التحقق","الأصلي","مطابقة","الاعتماد"]}]},{"w":1,"q":"موظف اعتمد على رقم مالي أعطاه كلود دون التحقق منه، وتبيّن لاحقًا أنه غير دقيق. أي مبادئ المحاضرة كان يجب اتّباعه؟","points":[{"t":"مبدأ افتراض الهلوسة: الإجابة قد تكون خاطئة بثقة حتى يثبت العكس.","k":["الهلوسة","خاطئة","بثقة","افتراض"]},{"t":"التحقق من كل معلومة حساسة — والأرقام المالية في مقدّمتها — من مصدر موثوق.","k":["التحقق","حساسة","مصدر","موثوق","الأرقام"]},{"t":"مطابقة الرقم بالسجل أو المستند الرسمي قبل إدراجه في أي مخرج.","k":["مطابقة","السجل","المستند","الرسمي"]},{"t":"الإشراف البشري: المسؤولية تقع على الموظف الموقّع لا على الأداة.","k":["الإشراف","البشري","المسؤولية","التوقيع","الموظف"]},{"t":"عمليًا: رفع الملف المصدري وطلب الاستخراج منه بدل الاعتماد على ذاكرة النموذج.","k":["رفع الملف","المصدر","استخراج","ذاكرة"]}]},{"w":2,"q":"موظف يفتح ملف الردود كل صباح، يفحصه يدويًا، ويكتب ملخّصًا — عشر دقائق يوميًا تضيع. أي واجهة تحلّ له هذا، وكيف يُعدّها؟","points":[{"t":"الحل: المهام المجدولة (Scheduled runs) من كوورك.","k":["مجدول","scheduled","كوورك","الجدولة"]},{"t":"صياغة الطلب: مراجعة الملف كل صباح في ساعة محدّدة وإرسال ملخّص.","k":["صباح","الساعة","يومي","محدد","وقت"]},{"t":"إنشاء المشغّل (Trigger) الذي يطلق المهمة، وتحديد مصدر الملف ووجهة المخرج.","k":["المشغل","trigger","الملف","المخرج"]},{"t":"متابعة سجل التنفيذات للتأكد من أن المهمة تعمل ولم تفوّت يومًا.","k":["سجل","التنفيذات","متابعة","تفويت"]},{"t":"الأثر: تحوّل الدور من التنفيذ اليدوي إلى المراجعة والقرار، وتوفير الوقت.","k":["مراجعة","قرار","توفير","الوقت","الأثر"]}]},{"w":2,"q":"مديرة فتحت «الجلسات النشطة» فوجدت جهازًا وموقعًا لا تعرفهما. ما دلالة ذلك، وما الإجراءات الواجبة فورًا؟","points":[{"t":"الدلالة: حسابها مفتوح على جهاز غير مصرَّح به — احتمال وصول غير مشروع.","k":["اختراق","غير مصرح","مفتوح","وصول"]},{"t":"إنهاء تلك الجلسة فورًا من قائمة الجلسات النشطة.","k":["إنهاء","إغلاق","فورا","الجلسة","تسجيل الخروج"]},{"t":"تغيير كلمة المرور وتفعيل التحقق بخطوتين.","k":["كلمة المرور","تغيير","التحقق","خطوتين"]},{"t":"مراجعة الأجهزة الموثوقة وحذف غير المعروف منها، وتفعيل «طلب أجهزة موثوقة».","k":["الأجهزة الموثوقة","حذف","موثوق"]},{"t":"إبلاغ مسؤول أمن المعلومات في الدائرة ومراجعة ما قد يكون اطُّلع عليه من محادثات وملفات.","k":["إبلاغ","أمن","مسؤول","مراجعة المحادثات"]},{"t":"جعل مراجعة الجلسات النشطة إجراءً أمنيًا دوريًا لا ردّ فعل.","k":["دوري","إجراء","روتين"]}]},{"w":2,"q":"موظف يريد أن تبقى مهامه على حاسوب الدائرة ولا تكمل في السحابة بعد إغلاق الجهاز. أي إعداد يستخدم، وما الأثر المترتب عليه؟","points":[{"t":"الإعداد: كوورك ← تفعيل «على حاسوبك فقط» (Only on your computer).","k":["only","حاسوبك","كوورك","المحلي"]},{"t":"الأثر المباشر: المهام تبقى على الجهاز وتتوقف عند إغلاقه ولا تكمل في السحابة.","k":["تتوقف","إغلاق","السحابة","تكمل"]},{"t":"المقابل: فقدان ميزة العمل بالخلفية وإكمال المهام الطويلة أثناء إغلاق الجهاز.","k":["خلفية","الطويلة","ميزة","تفوت"]},{"t":"الملاءمة: مناسب للبيانات الحساسة وسياسات الدوائر التي تمنع المعالجة السحابية.","k":["حساسة","سرية","سياسة","أمان"]},{"t":"يُستحسن اقترانه بتفعيل «طلب أجهزة موثوقة» لضبط أي جهاز يبدأ الجلسة.","k":["موثوقة","require","أجهزة"]}]}],"essay":[{"w":1,"q":"اشرح بأسلوبك الخاص الفرق بين «عقلية اللقطة الواحدة» و«عقلية التكرار»، ومثّل لكل منهما بموقف من عملك اليومي.","points":[{"t":"اللقطة الواحدة: توقّع إجابة كاملة من أمر واحد، فإما تُقبل كما هي أو تُرفض كلّها.","k":["لقطة","مرة واحدة","امر واحد","دفعة"]},{"t":"عقلية التكرار: بناء السياق تدريجيًا وتقديم ملاحظات محدّدة بعد كل نتيجة لتحسينها.","k":["التكرار","تدريجي","ملاحظات","تصحيح","تحسين"]},{"t":"معيار الاختيار: اللقطة الواحدة تكفي للمهام البسيطة والمعروفة، والتكرار ضروري للمهام المعقدة أو ذات الأسلوب الخاص.","k":["بسيطة","معقدة","سريعة","معيار"]},{"t":"مثال للقطة الواحدة من العمل: صياغة رسالة قصيرة أو تصحيح لغوي.","k":["رسالة","قصيرة","تصحيح"]},{"t":"مثال للتكرار من العمل: إعداد تقرير أو دراسة تُبنى على مراحل مع مراجعة كل مرحلة.","k":["تقرير","دراسة","مسودة","مراحل"]},{"t":"الأثر: التكرار يرفع جودة الناتج ويقلّل زمن المراجعة النهائية رغم أنه يبدو أطول.","k":["جودة","الوقت","المراجعة","نتيجة افضل"]}]},{"w":1,"q":"ناقش كيف يمكن الاستفادة من «المشاريع» (Projects) بتنظيم عمل دائرة حكومية تتعامل مع نفس نوع المعاملات بشكل متكرر.","points":[{"t":"إنشاء مشروع مستقل لكل نوع معاملة، بتعليمات ثابتة تصف الأسلوب والشكل المطلوب.","k":["مشروع","تعليمات","ثابتة","مستقل"]},{"t":"رفع الملفات المرجعية: النماذج المعتمدة والتعاميم والقوانين لتكون قاعدة معرفة المشروع.","k":["ملفات","مرجعية","نماذج","تعاميم","قاعدة المعرفة"]},{"t":"توحيد الصياغة بين الموظفين وتقليل التباين في المخرجات الرسمية.","k":["توحيد","الصياغة","تباين","موحد"]},{"t":"اختصار الزمن: لا حاجة لإعادة شرح السياق في كل معاملة جديدة.","k":["الوقت","الزمن","إعادة شرح","اختصار"]},{"t":"استمرارية المعرفة المؤسسية عند تغيّر الموظفين، لأن الأسلوب مخزون في المشروع لا في ذاكرة شخص.","k":["استمرارية","المؤسسية","تغير الموظف","تسليم"]},{"t":"الضوابط: تصنيف البيانات وعدم رفع السرّي، ومراجعة بشرية قبل اعتماد أي مخرج.","k":["سري","تصنيف","مراجعة","بشري","الخصوصية"]}]},{"w":2,"q":"ناقش الإعدادات التي يجب على دائرة حكومية ضبطها قبل السماح لموظفيها باستخدام كلود في العمل الرسمي، ولماذا كل واحد منها.","points":[{"t":"الملف الشخصي والتعليمات الدائمة الموحّدة لضمان أسلوب رسمي ثابت لكل الموظفين.","k":["التعليمات","الملف الشخصي","موحد","أسلوب"]},{"t":"«طلب أجهزة موثوقة» ومراجعة الجلسات النشطة دوريًا لمنع الوصول غير المصرَّح.","k":["الأجهزة الموثوقة","الجلسات النشطة","مراجعة","وصول"]},{"t":"الخصوصية: ضبط التصدير والحذف، وإلزام إخفاء الهوية وتصنيف البيانات قبل الرفع.","k":["الخصوصية","تصدير","حذف","إخفاء الهوية","تصنيف"]},{"t":"القدرات والموصلات: تفعيل ما تحتاجه الدائرة فقط، وربط حسابات عمل رسمية لا شخصية.","k":["القدرات","الموصلات","ربط","حساب"]},{"t":"الفوترة والاستخدام: ضبط إعادة الشحن التلقائي ومراقبة الاستهلاك ضمن سقف معلوم.","k":["الفوترة","إعادة الشحن","رصيد","استهلاك"]},{"t":"خيار «على حاسوبك فقط» للمهام التي تمسّ بيانات لا يجوز خروجها إلى السحابة.","k":["حاسوبك","السحابة","محلي","only"]},{"t":"الحوكمة: سياسة استخدام مؤسسي تحدّد من يستخدم ولأي غرض وبأي صلاحية، مع إشراف بشري قبل الاعتماد.","k":["سياسة","حوكمة","إشراف","صلاحية","اعتماد"]}]}]},"cases":[{"lvl":"بسيط","t":"كتاب رسمي في دقيقتين","situ":"مدير قسم يكتب كتاب اعتذار عن تأخير معاملة من الصفر في كل مرة، فيستغرق نحو عشرين دقيقة، والصياغة تختلف من كتاب لآخر.","steps":["يكتب مرة واحدة في <b>التعليمات الدائمة</b>: موقعه الوظيفي، واسم الدائرة، وأسلوب الصياغة المطلوب.","يعطي المعطيات فقط: رقم المعاملة، سبب التأخير، الموعد الجديد.","يحدّد الشكل: كتاب رسمي بثلاث فقرات، بلا عبارات مبالغة.","يراجع النص ويعدّل ما يلزم <b>قبل التوقيع</b>."],"tools":["التعليمات الدائمة","القواعد الذهبية الأربع"],"out":"كتاب جاهز خلال دقيقتين بدل عشرين، وبأسلوب موحّد في كل مرة."},{"lvl":"بسيط","t":"تلخيص محضر اجتماع","situ":"محضر اجتماع من اثنتي عشرة صفحة، والمطلوب ملخّص بصفحة واحدة يبيّن القرارات والجهات المكلّفة والمواعيد.","steps":["يرفع ملف المحضر مباشرة إلى المحادثة.","يطلب جدولًا بثلاثة أعمدة: القرار · الجهة المكلّفة · الموعد.","يطلب فقرة ختامية تجمع البنود المؤجّلة.","يطابق الجدول بالمحضر الأصلي قبل التعميم."],"tools":["رفع الملفات","المخرجات المنسّقة","التحقّق"],"out":"ملخّص جاهز للتعميم، وجدول متابعة يُنسخ مباشرة إلى نظام المتابعة."},{"lvl":"متوسط","t":"فرز شكاوى المواطنين وتصنيفها","situ":"نحو أربعمئة شكوى شهريًا بصيغ حرّة، والإدارة لا تعرف أي نوع من الشكاوى يتكرر أكثر لتعالج سببه.","steps":["<b>قبل أي شيء:</b> حذف الأسماء وأرقام الهواتف والعناوين — <mark class='hp-hl'>إخفاء الهوية إلزامي</mark>.","رفع الملف بعد التنظيف.","طلب تصنيف الشكاوى إلى فئات محدّدة مسبقًا، لا أن يخترعها البرنامج.","طلب جدول بعدد الشكاوى في كل فئة ونسبتها المئوية.","طلب رسم بياني يعرض النتيجة داخل أرتيفاكت.","مراجعة عيّنة عشوائية يدويًا للتأكّد من دقّة التصنيف."],"tools":["إخفاء الهوية","رفع الملفات","التحليل الوصفي","الأرتيفاكتس"],"out":"تقرير شهري يبيّن أكثر ثلاث فئات تكرارًا — أساس لقرار إداري يعالج السبب لا العَرَض."},{"lvl":"متوسط","t":"التقرير الشهري المتكرّر","situ":"تقرير شهري بالصيغة نفسها، يُعاد شرح متطلّباته في كل مرة، والشكل يختلف من شهر لآخر فيربك مدقّقيه.","steps":["إنشاء <b>مشروع</b> باسم «التقرير الشهري».","في التعليمات الثابتة: الصيغة، النبرة، الطول، وأقسام التقرير بالترتيب.","في الملفات المرجعية: تقارير ثلاثة أشهر سابقة معتمدة كنموذج.","كل شهر: رفع بيانات ذلك الشهر فقط وطلب التقرير.","مراجعة الأرقام ومطابقتها بالسجلات قبل الاعتماد."],"tools":["المشاريع","التعليمات الثابتة","قاعدة المعرفة"],"out":"تقرير موحّد الشكل بلا نقاش، وزمن الإعداد ينزل من ساعتين إلى ربع ساعة."},{"lvl":"متقدم","t":"منظومة متابعة أداء أسبوعية","situ":"مدير عام يريد لوحة متابعة أسبوعية لأداء خمسة أقسام، تجمع بياناتها من ملفات متفرّقة، وتكون جاهزة على مكتبه صباح كل أحد بلا أن يطلبها.","steps":["<b>مشروع «متابعة الأداء»:</b> التعليمات + تعريف مؤشّرات القياس + نماذج التقارير السابقة.","<b>مهارة خاصة</b> تثبّت طريقة الحساب وشكل العرض، فلا تتغيّر من أسبوع لآخر.","<b>موصل</b> إلى مجلّد التقارير — بحساب عمل مخصّص، وبعد تصنيف البيانات والتأكّد من خلوّها من السرّي.","<b>مهمة مجدولة</b> كل أحد الساعة السابعة: تقرأ ملفات الأسبوع، تحسب المؤشّرات، وتنتج اللوحة.","<b>مراجعة بشرية إلزامية:</b> المدير يعتمد أو يعيد — لا تُعمّم اللوحة تلقائيًا.","متابعة <b>سجلّ التنفيذات</b> للتأكّد من عدم تفويت أي أسبوع."],"tools":["المشاريع","المهارات","الموصلات","المهام المجدولة","الأرتيفاكتس","الإشراف البشري"],"out":"لوحة أسبوعية جاهزة صباح الأحد، ودور المدير يتحوّل من <mark class='hp-hl'>جمع وحساب</mark> إلى <mark class='hp-hl'>مراجعة وقرار</mark>."}]},"legal":{"lectures":[{"title":"المحاضرة الأولى — التحول الإلكتروني وأثره في الإدارة والوظيفة العامة","subtitle":"إعداد: المستشار د. مازن ليلو راضي","sections":[{"h":"أولًا: مقدمة","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>التطور التقني أحدث تحولات جوهرية طالت الإدارة والوظيفة العامة.</li><li>استخدام الوسائل الإلكترونية <b>لا يعني خروج الإدارة عن حكم القانون</b>.</li><li>الثقافة القانونية الرقمية ضرورة لا تقل أهمية عن الكفاءة التقنية.</li></ul></div><p>أدى التطور المتسارع في تكنولوجيا المعلومات والاتصالات إلى إحداث تحولات جوهرية في مختلف مجالات الحياة، ولم تكن الإدارة والوظيفة العامة بمنأى عن هذه التحولات، إذ انتقلت وسائل العمل الإداري تدريجيًا من الاعتماد الكامل على المستندات الورقية والإجراءات التقليدية إلى استخدام الحاسوب وشبكات الاتصال والوسائل الإلكترونية في حفظ المعلومات ومعالجتها وتبادلها.</p><p>لا تقتصر أهمية هذا التطور على الجانب التقني، بل تمتد آثاره إلى الجانب القانوني؛ لأن الإدارة عندما تستخدم الوسائل الإلكترونية في ممارسة اختصاصاتها تظل خاضعة للقواعد القانونية التي تحكم نشاطها. فالتحول في وسيلة أداء الوظيفة العامة لا يعني التحلل من أحكام القانون، وإنما يفرض إعادة النظر في كيفية تطبيق بعض القواعد القانونية التقليدية، كما يدفع إلى وضع تنظيم قانوني للمسائل الجديدة التي أفرزتها البيئة الإلكترونية.</p><p>ومن هنا تبرز أهمية الثقافة القانونية في عصر التحول الرقمي؛ إذ لا يكفي أن يعرف الموظف كيفية استخدام الحاسوب أو النظام الإلكتروني، بل ينبغي أن يدرك أيضًا الحدود القانونية لاستخدامه، وطبيعة واجباته عند التعامل مع البيانات والمعلومات، والمسؤولية التي يمكن أن تترتب على إساءة استخدام الوسائل الإلكترونية.</p>"},{"h":"ثانيًا: مفهوم التطور الإلكتروني في مجال الإدارة العامة","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>توظيف تقنيات المعلومات والاتصال في أداء وظائف الإدارة العامة.</li><li>الإدارة الإلكترونية تقوم على عنصرين: <b>تقني</b> (أجهزة وبرامج وشبكات) و<b>بشري</b> (موظفون مؤهلون).</li><li>التقنية وسيلة لتنفيذ النشاط الإداري وليست بديلًا عن القانون الذي يحكمه.</li></ul></div><p>يُقصد بالتطور الإلكتروني في نطاق الوظيفة العامة ما أتاحته تكنولوجيا المعلومات والاتصالات من وسائل وأجهزة وبرامج وشبكات في أداء الوظائف والمهام التي تضطلع بها الإدارة العامة.</p><p>فالإدارة في صورتها التقليدية كانت تعتمد بدرجة كبيرة على العنصر البشري وعلى المستندات والسجلات الورقية، وكانت المعاملة تنتقل بين الموظفين والوحدات الإدارية بصورة مادية. أما في ظل التطور الإلكتروني، فقد أصبح من الممكن حفظ البيانات واسترجاعها وتبادلها ومتابعتها من إنجاز كثير من الإجراءات ومتابعتها بواسطة الحاسوب وشبكات الاتصال.</p><p>ولا يعني ذلك اختفاء الموظف العام أو انتهاء دوره، وإنما يعني تغيّر طريقة أداء الموظف لمهامه وواجباته. فقد أصبحت التقنية أداة رئيسية يعتمد عليها الموظف في إنجاز أعماله، وفي الوقت ذاته أصبحت مصدرًا لواجبات ومسؤوليات جديدة لم تكن بنفس الوضوح في البيئة التقليدية.</p><p>وتقوم الإدارة الإلكترونية على عنصرين أساسيين: <b>العنصر التقني</b> ويتمثل في أجهزة الحاسوب والبرامج وقواعد البيانات وشبكات الاتصال والتطبيقات الإلكترونية، و<b>العنصر البشري</b> ويتمثل في الموظفين والمتخصصين والخبراء القادرين على تشغيل هذه الأنظمة وتوظيفها في مجال العمل الوظيفي.</p><p>ومن الناحية القانونية تبرز هنا مسألة مهمة: أن التقنية تظل وسيلة لأداء النشاط الإداري وليست بديلًا عن القانون الذي يحكم هذا النشاط. فالقرار الذي يصدر إلكترونيًا يجب أن يستند إلى اختصاص قانوني، والمعلومات الإلكترونية يجب أن تحظى بالحماية المناسبة، والموظف الذي يستخدم النظام يبقى مسؤولًا عن احترام حدود وظيفته وصلاحياته.</p>"},{"h":"ثالثًا: الانتقال من الإدارة التقليدية إلى الإدارة الإلكترونية","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>توسيع المشاركة الوظيفية وتوزيع المهام بين وحدات الإدارة المختلفة.</li><li>إعادة تنظيم أساليب العمل وإجراءات إنجاز المعاملات بما يلائم البيئة الرقمية.</li><li>ضرورة أن يواكب هذا الانتقال حماية حقوق الأفراد التي كفلها القانون.</li></ul></div><p>يتم الانتقال من الإدارة التقليدية إلى الإدارة الإلكترونية بصورة تدريجية ومتصلة، تبدأ من نقل الإجراءات الورقية والروتينية إلى شكل إلكتروني، ثم تطوير قواعد بيانات موحدة للمعاملات، وصولًا إلى ربط الوحدات الإدارية والمستفيدين بأنظمة إلكترونية متكاملة تسمح بإنجاز المعاملة من إعادة النظر في طريقة تصميم الإجراءات ذاتها بما يواكب الوسيلة الإلكترونية الجديدة.</p><p>ولا يقتصر هذا التحول على سرعة الإنجاز، وإنما يمتد ليشمل إعادة تنظيم آلية اتخاذ القرار ومتابعة مراحل المعاملة والرقابة عليها وتحديد المسؤول عن كل إجراء بدقة، وهو ما يستدعي وجود إطار قانوني ينظم هذه المسائل ويحمي حقوق المتعاملين معها.</p>"},{"h":"رابعًا: الحكومة الإلكترونية وعلاقتها بالوظيفة العامة","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>الحكومة الإلكترونية ليست حكومة جديدة، بل الحكومة ذاتها بوسائل أداء حديثة.</li><li>الجهة الإدارية والموظف يبقيان خاضعين للقانون رغم تغيّر أداة العمل.</li><li>تؤثر تنظيميًا (في الهياكل والإجراءات) وقانونيًا (في صحة الإجراءات والمسؤولية).</li></ul></div><p>تمثل الحكومة الإلكترونية صورة متقدمة من صور الاستفادة من التطور الإلكتروني في أداء وظائف الدولة، وتقوم فكرتها على استخدام تقنيات المعلومات والاتصالات في إنجاز الأعمال الحكومية وتقديم الخدمات وتبادل البيانات والمعلومات.</p><p>وبذلك فإن الحكومة الإلكترونية لا تعني إنشاء حكومة جديدة تختلف عن الحكومة التقليدية من حيث طبيعتها القانونية، وإنما تعني أن الدولة تؤدي جانبًا من وظائفها باستخدام وسائل إلكترونية حديثة. فالجهة الإدارية تبقى ذاتها، واختصاصاتها تستند إلى القانون، والموظف العام يبقى خاضعًا للنظام القانوني للوظيفة العامة، لكن الوسيلة المستخدمة في إنجاز العمل تتغيّر.</p><p>وتظهر أهمية الحكومة الإلكترونية في مجال الوظيفة العامة من خلال جوانب متعددة، منها: تنظيم البيانات المتعلقة بالموظفين، إدارة الجوانب المالية والإدارية، تداول المراسلات والوثائق إلكترونيًا، تسهيل الاتصال بين الموظفين والرؤساء الإداريين، متابعة مراحل تنفيذ القرارات، توفير المعلومات اللازمة لاتخاذ القرارات الإدارية، وتسهيل تقديم الخدمات العامة للمواطنين.</p><p>وبذلك توفّر الحكومة الإلكترونية للوظيفة العامة من ناحيتين أساسيتين: <b>ناحية تنظيمية</b> لأنها تغيّر أساليب العمل والهياكل والإجراءات، و<b>ناحية قانونية</b> لأنها تثير مسائل تتعلق بصحة الإجراءات وحماية البيانات والمستندات والاختصاص والمسؤولية.</p>"},{"h":"خامسًا: تطبيقات التطور الإلكتروني في الوظيفة العامة","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>تشمل الرواتب والإجازات والترقيات وشؤون الموظفين والأرشفة والمعاملات الإدارية.</li><li>دقة البيانات المحفوظة إلكترونيًا مسألة قانونية لارتباطها المباشر بحقوق الموظف.</li><li>الخطأ التقني في النظام قد ينعكس مباشرة كضرر مادي على الموظف (مثال الاستقطاع الخاطئ).</li></ul></div><p>يتسع نطاق تطبيق الأنظمة الإلكترونية في الوظيفة العامة ليشمل مختلف الجوانب الإدارية والمالية والتنظيمية، ومن أبرز هذه التطبيقات: الرواتب والمخصصات، الإجازات والغيابات، الترقيات والعلاوات، إدارة شؤون الموظفين، المخازن والحسابات، المشتريات والعقود، المراسلات الإدارية، الأرشفة الإلكترونية، حفظ البيانات والمعلومات، ومتابعة إنجاز المعاملات.</p><p>وتكشف هذه التطبيقات أن التطور الإلكتروني أصبح مرتبطًا بصورة مباشرة بالمركز القانوني للموظف العام. فعندما تُحفَظ إجازات الموظف وغياباته وترقياته وبياناته الوظيفية إلكترونيًا، فإن هذه البيانات قد تكون أساسًا لترتيب حق أو فرض التزام، ومن ثم فإن دقة هذه البيانات وسلامتها وحمايتها تصبح مسألة قانونية وليست مجرد مسألة تقنية.</p><p>فمثلًا: إذا سجّل النظام الإلكتروني خطأً — نتيجة عمل موظف عن مدة معينة، ثم رتّب على ذلك استقطاعًا من راتبه — فإن هذا الخطأ التقني لا يبقى محصورًا داخل النظام، وإنما ينعكس مباشرة على حق مالي للموظف. وهنا تظهر أهمية وجود آلية قانونية وإدارية لمراجعة البيانات وتصحيحها وتحديد المسؤولية عن الخطأ.</p><p>والأمر نفسه ينطبق على الأرشفة الإلكترونية؛ فالوثيقة التي كانت تُحفَظ سابقًا في ملف ورقي أصبحت قابلة للحفظ في وسائط إلكترونية، وهو ما يثير مسائل تتعلق بسلامة الوثيقة، وإمكان الرجوع إليها، وإثبات صحتها، وحمايتها من التعديل أو الإتلاف. ولهذا يتطلب نجاح الأرشفة الإلكترونية اعتماد وسائل مناسبة لحفظ الوثائق والمعلومات، وإنشاء نسخ احتياطية منها، وتحديث وسائل التخزين والأجهزة والبرامج بصورة دورية.</p>"},{"h":"سادسًا: الأثر القانوني للتحول الإلكتروني في الوظيفة العامة","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>تظهر إشكاليات جديدة: القيمة القانونية للمستند الإلكتروني، وإثبات هوية المستخدم، وحجية المراسلات.</li><li>أمن المعلومات يتطلب التحقق من الهوية وضبط الصلاحيات وحماية البيانات من التلاعب.</li><li>تجاوز الموظف صلاحياته الإلكترونية أو إساءة استخدامها يستوجب المساءلة القانونية.</li></ul></div><p>من أهم النتائج التي ينبغي أن يدركها الدارس أن التطور الإلكتروني ليس موضوعًا تقنيًا منفصلًا عن القانون؛ فكلما اتسع استخدام التقنية في الإدارة ظهرت مسائل قانونية جديدة، أو أعيد طرح مسائل قانونية تقليدية بصورة مختلفة.</p><p>ففي البيئة التقليدية يكون من السهل نسبيًا تحديد المستند الأصلي وتوقيعه وحائزه ومكان وجوده، أما في البيئة الإلكترونية فتظهر أسئلة قانونية متعددة، منها: ما القيمة القانونية للمستند الإلكتروني؟ كيف يمكن تحديد الشخص الذي أدخل البيانات أو عدّلها؟ ما مدى إمكانية اعتماد المراسلات الإلكترونية في الإثبات؟ كيف يتم التحقق من هوية مستخدم النظام؟ من يملك صلاحية الوصول إلى البيانات؟ ومن يتحمل المسؤولية عند تعديل البيانات أو إتلافها بصورة غير مشروعة؟</p><p>كما تظهر كذلك مسألة سرّية المعلومات وحمايتها؛ إذ بات من الممكن نسخ كمية كبيرة من المعلومات أو نقلها خلال وقت قصير، وقد تكون هذه المعلومات متعلقة بالمواطنين أو الموظفين أو بالمصالح المالية والإدارية والأمنية للدولة. ولذلك يتطلب أمن المعلومات اتخاذ إجراءات تضمن: التحقق من هوية مستخدم النظام، التأكد من صلاحية الشخص في الوصول إلى المعلومات، منع التعديل أو الحذف غير المصرّح به، المحافظة على سرّية المعلومات، حماية البيانات من الإتلاف أو الضياع، وتوفير إمكانية تتبّع العمليات التي تتم داخل النظام.</p><p>ويظهر أثر التحول الرقمي كذلك في مسؤولية الموظف الوظيفية؛ فالموظف الذي يتجاوز صلاحياته الإلكترونية، أو يتلف البيانات والمعلومات عمدًا، أو يسمح لشخص غير مخوَّل باستخدام النظام، قد يرتكب مخالفة تستوجب مساءلته وفقًا للقواعد القانونية النافذة. ومن صور الأفعال غير المشروعة في البيئة الإلكترونية: إتلاف البرامج والمعلومات والبيانات والملفات والأنظمة، وتعطيل الأجهزة والأنظمة، وانتحال الشخصية، والدخول غير المصرّح به إلى الأنظمة أو البيانات.</p>"},{"h":"سابعًا: أثر التطور الإلكتروني في كفاءة المرفق العام","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>يرفع الكفاءة عبر سرعة الإنجاز وتقليل الروتين وتحسين اتخاذ القرار.</li><li>يخلق في المقابل تحديًا يمسّ مبدأ استمرار المرفق العام بانتظام واطراد.</li><li>صيانة الأنظمة والنسخ الاحتياطي وخطط الطوارئ ضرورية لضمان الاستمرارية.</li></ul></div><p>ترتبط الوظيفة العامة ارتباطًا وثيقًا بالمرفق العام، ولذلك فإن الهدف النهائي من تطوير وسائل أداء الموظف العام هو تحسين قدرة المرافق العامة على تقديم خدماتها للمواطنين. ويمكن أن يسهم استخدام تكنولوجيا المعلومات والاتصالات في رفع كفاءة المرفق العام من خلال: سرعة إنجاز المعاملات، تقليل الإجراءات الروتينية، سهولة الوصول إلى المعلومات، تحسين عملية اتخاذ القرار، تسهيل الاتصال بين الوحدات الإدارية، تقليل الوقت والجهد اللازمين لإنجاز المعاملات، تعزيز الرقابة والتدقيق، وتحسين جودة الخدمات العامة.</p><p>لكن الاعتماد على التقنية في الوقت ذاته يخلق تحديًا جديدًا يتعلق بمبدأ استمرار المرفق العام بانتظام واطراد. فإذا أصبحت الخدمات تعتمد بصورة أساسية على الأنظمة الإلكترونية، فإن توقف النظام أو فقدان البيانات أو تعرّض الشبكة للاختراق قد يؤدي إلى توقف الخدمة أو اضطرابها. ومن هنا تصبح صيانة الأنظمة، وحماية البيانات، وإنشاء النسخ الاحتياطية، ووضع خطط للطوارئ، وتأهيل الموظفين، مسائل ترتبط بصورة مباشرة بضمان استمرار المرفق العام في أداء وظائفه.</p>"},{"h":"ثامنًا: الرقابة والشفافية في الإدارة الإلكترونية","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>الأنظمة الإلكترونية تتيح رقابة أدق وأسرع مقارنة بالإدارة الورقية.</li><li>تعزز الشفافية وتساعد في حماية المال العام وتحديد المسؤولية.</li><li>يجب التوازن بين حق الرقابة وحماية خصوصية الموظف ضمن حدود القانون.</li></ul></div><p>من أهم الآثار الإيجابية للتحول الإلكتروني زيادة القدرة على الرقابة والمتابعة. ففي الإدارة الورقية قد يصعب أحيانًا تحديد المرحلة التي وصلت إليها المعاملة، أو معرفة الموظف الذي قام بإجراء معيّن عليها، بينما يمكن للنظام الإلكتروني — بحسب طريقة تصميمه — تسجيل وقت الدخول إلى النظام، ونوع الإجراء الذي تم، والشخص الذي قام به، ووقت إحالة المعاملة إلى المرحلة التالية.</p><p>كما تتيح الأنظمة الإلكترونية للجهات الرقابية الوصول إلى البيانات والمستندات ومراجعة الأعمال بصورة أسرع، الأمر الذي يسهم في اكتشاف المخالفات والتحقق من مطابقة الإجراءات للقوانين والأنظمة والتعليمات. وتزداد أهمية ذلك في حماية المال العام، ومتابعة عمليات الصرف والمشتريات، وتحديد المسؤول عن اتخاذ الإجراءات والقرارات.</p><p>كما يمكن للتحول الإلكتروني أن يعزّز الشفافية الإدارية من خلال توفير المعلومات، وتسهيل متابعة المعاملات، وتقليل بعض صور التدخل الشخصي في الإجراءات الإدارية. وفي المقابل، ينبغي ألا تتحول الرقابة الإلكترونية إلى وسيلة غير محدودة للتدخل في خصوصية الموظف؛ ولذلك يجب تحقيق التوازن بين حق الإدارة في الرقابة على أداء الوظيفة، وبين ضرورة استخدام أدوات الرقابة للغرض الوظيفي المشروع وفي الحدود التي يسمح بها القانون.</p>"},{"h":"تاسعًا: المعوقات القانونية والإدارية للتحول الإلكتروني","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>أربعة أنواع: معوقات إدارية-تنظيمية، وقانونية، وتقنية-مالية، وبشرية.</li><li>التشريعات القائمة غالبًا لا تواكب قضايا التوقيع الإلكتروني والإثبات وحماية البيانات.</li><li>نجاح التحول يستلزم التقاء الثقافة القانونية بالثقافة التقنية لدى الموظف.</li></ul></div><p>لا يمكن تحقيق الانتقال إلى الإدارة والوظيفة العامة الإلكترونية بمجرد شراء الأجهزة والبرامج، بل يحتاج ذلك إلى بيئة إدارية وقانونية وتقنية وبشرية متكاملة. ويمكن تصنيف أهم المعوقات إلى أربعة أنواع:</p><p><b>١. المعوقات الإدارية والتنظيمية:</b> وتتمثل في ضعف التخطيط والتنسيق، وتعقيد الإجراءات، وعدم وضوح استراتيجية التحول الإلكتروني، وضعف الإدارة المشرفة على مشروعات تكنولوجيا المعلومات، وعدم إعادة تنظيم الإجراءات بما يتناسب مع البيئة الرقمية.</p><p><b>٢. المعوقات القانونية:</b> وتظهر عندما تكون التشريعات والأنظمة والتعليمات غير قادرة على مواكبة التطورات التكنولوجية، ولا سيما في المسائل المتعلقة بالمستندات الإلكترونية، والتوقيع الإلكتروني، وإمكانية الاعتماد عليها في الإثبات، وحماية البيانات، والمعاملات الإلكترونية، والجرائم المرتبطة باستخدام الأنظمة والشبكات.</p><p><b>٣. المعوقات التقنية والمالية:</b> وتشمل ضعف البنية التحتية التقنية، وعدم كفاية الأجهزة والبرامج، وضعف شبكات الاتصال، وارتفاع تكاليف إنشاء الأنظمة وصيانتها وتحديثها، إضافة إلى مخاطر الاختراق وفقدان البيانات.</p><p><b>٤. المعوقات البشرية:</b> وتتمثل في ضعف الوعي الإلكتروني، وقلة الكوادر المتخصصة، ومقاومة بعض الموظفين للانتقال من النظام الورقي إلى الإلكتروني، وضعف التدريب والمهارات اللازمة لاستخدام التقنيات الحديثة.</p><p>وهنا تلتقي الثقافة القانونية بالثقافة التقنية؛ فالموظف يحتاج إلى معرفة كيفية استخدام النظام أو الحاسوب الإلكتروني، لكنه يحتاج في الوقت ذاته إلى معرفة ما يجوز له فعله وما لا يجوز، وحدود صلاحياته، ومسؤوليته عن المعلومات والبيانات التي يتعامل معها.</p>"},{"h":"عاشرًا: من التحول الإلكتروني إلى الذكاء الاصطناعي","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>الذكاء الاصطناعي يمثل مرحلة أكثر تقدمًا من الإدارة الإلكترونية التقليدية.</li><li>يثير تساؤلات جديدة حول المسؤولية عن الخطأ الخوارزمي والرقابة البشرية على القرار.</li><li>تحتاج هذه المسائل إلى دراسة قانونية مستقلة نظرًا لتعقيدها.</li></ul></div><p>يمهّد التطور الإلكتروني في الوظيفة العامة لمرحلة أكثر تقدمًا تتمثل في استخدام تقنيات الذكاء الاصطناعي لأداء بعض المهام والواجبات الوظيفية. فالإدارة الإلكترونية تعتمد بصورة أساسية على استخدام الحاسوب والبرامج والشبكات في تنفيذ الإجراءات ومعالجة البيانات وفق أنظمة موضوعة مسبقًا، أما تقنيات الذكاء الاصطناعي فتتّجه إلى مستوى أكثر تقدمًا من تحليل البيانات، واكتشاف الأنماط، والتنبؤ، والاستدلال، والمساعدة في اتخاذ القرارات.</p><p>وقد يؤدي استخدام هذه التقنيات في الوظيفة العامة إلى ظهور مجموعة من التساؤلات القانونية المهمة، من أبرزها: من يتحمل المسؤولية عن الخطأ الذي ينتج عن نظام يعتمد على الذكاء الاصطناعي؟ هل يجوز الاعتماد على النظام الذكي في اتخاذ قرار يمسّ المركز القانوني للموظف أو المواطن؟ ما حدود الرقابة البشرية على القرارات التي تقترحها الأنظمة الذكية؟ كيف يمكن ضمان عدم تحيّز الخوارزميات؟ كيف تُحمى البيانات التي تستخدمها أنظمة الذكاء الاصطناعي؟ وما حدود واجب الموظف في مراجعة النتائج التي يقدّمها النظام؟</p><p>وهذه المسائل تمثّل امتدادًا طبيعيًا لموضوع التحول الإلكتروني، إلا أنها تحتاج إلى دراسة مستقلة نظرًا لما تثيره من إشكالات قانونية تتعلق بالاختصاص والمسؤولية والشفافية وحماية الحقوق.</p>"},{"h":"خاتمة والقاعدة الأساسية","body":"<div class='hp-keypoints'><span class='hp-kp-title'>النقاط الجوهرية</span><ul><li>التحول الرقمي غيّر أساليب أداء الوظيفة العامة تغييرًا واسعًا وشاملًا.</li><li>التقنية مهما تطورت تبقى خاضعة لإطار القانون ولا تعمل خارجه.</li><li><b>القاعدة الجوهرية:</b> التحول الرقمي يغيّر الوسيلة، لا يُلغي الخضوع للقانون.</li></ul></div><p>يتضح مما تقدّم أن التحول الإلكتروني أحدث تغييرًا واسعًا في الوظيفة العامة، سواء من حيث أساليب أداء الأعمال، أو حفظ المعلومات، أو تقديم الخدمات، أو الرقابة، أو العلاقة بين الموظف والإدارة. ولم يعد من الممكن النظر إلى التكنولوجيا باعتبارها مجرد أداة مساعدة، بل أصبحت جزءًا أساسيًا من البيئة التي تُمارَس فيها الوظيفة العامة.</p><p>ومع ذلك، فإن التقنية مهما بلغت من التطور تظل تعمل ضمن إطار القانون؛ فالإدارة الإلكترونية تظل إدارة عامة، والموظف الذي يستخدم الوسائل الرقمية يظل ملتزمًا بواجباته القانونية، والقرار الإداري لا يفقد طبيعته القانونية لمجرد صدوره بوسيلة إلكترونية.</p><div class='hp-note'><b>القاعدة الأساسية:</b> إن التحول الرقمي يغيّر وسيلة أداء الوظيفة العامة، لكنه لا يُلغي خضوع الإدارة والموظف للقانون؛ بل يفرض تطوير القواعد القانونية بما يضمن المشروعية والكفاءة والشفافية وحماية الحقوق في البيئة الرقمية.</div>"}],"terms":[["الإدارة الإلكترونية","استخدام الحاسوب والبرامج وشبكات الاتصال في أداء وظائف الإدارة العامة ومهامها."],["الحكومة الإلكترونية","استخدام تقنيات المعلومات والاتصالات لإنجاز الأعمال الحكومية وتقديم الخدمات وتبادل البيانات."],["العنصر التقني","أجهزة الحاسوب والبرامج وقواعد البيانات والشبكات والتطبيقات الإلكترونية."],["العنصر البشري","الموظفون والمتخصصون القادرون على تشغيل الأنظمة الإلكترونية وتوظيفها وظيفيًا."],["الأرشفة الإلكترونية","حفظ الوثائق والمستندات في وسائط إلكترونية بدل الملفات الورقية."],["أمن المعلومات","مجموعة الإجراءات التي تضمن سرّية البيانات وسلامتها والتحقق من هوية المستخدم وصلاحياته."],["استمرار المرفق العام بانتظام واطراد","مبدأ يوجب على المرفق العام أداء خدماته باستمرار دون انقطاع، بما في ذلك عند الاعتماد على الأنظمة الإلكترونية."]]}],"summary":[{"h":"مفهوم التحول الإلكتروني","items":["التطور الإلكتروني هو توظيف تكنولوجيا المعلومات والاتصالات في أداء وظائف الإدارة العامة.","يقوم على عنصرين: تقني (أجهزة وبرامج وشبكات) وبشري (موظفون ومتخصصون).","التقنية وسيلة لأداء النشاط الإداري، وليست بديلًا عن القانون الذي يحكمه.","الحكومة الإلك
