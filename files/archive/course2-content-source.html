ترونية ليست حكومة جديدة، بل الحكومة ذاتها تؤدي وظائفها بوسيلة إلكترونية."]},{"h":"التطبيقات والأثر القانوني","items":["من أبرز التطبيقات: الرواتب، الإجازات، الترقيات، شؤون الموظفين، المشتريات، المراسلات، والأرشفة الإلكترونية.","دقة البيانات الإلكترونية وسلامتها وحمايتها مسألة قانونية لا تقنية فقط، لأنها ترتّب حقوقًا والتزامات.","تثير البيئة الإلكترونية أسئلة قانونية جديدة: قيمة المستند الإلكتروني، إثبات هوية المستخدم، الاعتماد على المراسلات الإلكترونية في الإثبات، ومسؤولية إتلاف البيانات.","أمن المعلومات يتطلب: التحقق من الهوية، التأكد من الصلاحية، منع التعديل غير المصرّح به، الحفاظ على السرّية، والحماية من الإتلاف."]},{"h":"الكفاءة والرقابة والمعوقات","items":["التحول الإلكتروني يرفع كفاءة المرفق العام: سرعة الإنجاز، تقليل الروتين، تحسين اتخاذ القرار، وتعزيز الرقابة.","في المقابل يخلق تحديًا يتعلق باستمرار المرفق العام بانتظام واطراد عند توقف الأنظمة أو الاختراق.","الرقابة الإلكترونية تزيد الشفافية، لكن يجب موازنتها مع حماية خصوصية الموظف.","المعوقات أربعة أنواع: إدارية وتنظيمية، قانونية، تقنية ومالية، وبشرية."]},{"h":"من التحول الإلكتروني إلى الذكاء الاصطناعي","items":["استخدام الذكاء الاصطناعي في الوظيفة العامة مرحلة أكثر تقدمًا من الإدارة الإلكترونية.","يثير تساؤلات قانونية جديدة: المسؤولية عن خطأ النظام الذكي، حدود الرقابة البشرية، تحيّز الخوارزميات، وحماية البيانات.","القاعدة الأساسية: التحول الرقمي يغيّر الوسيلة، لا يلغي خضوع الإدارة والموظف للقانون."]}],"exercises":[{"lvl":"بسيط","t":"استخراج العنصرين","b":"عد إلى نص المحاضرة وحدد بأسلوبك: ما مكونات العنصر التقني وما مكونات العنصر البشري في الإدارة الإلكترونية؟ ولماذا لا يكفي توفر أحدهما دون الآخر؟"},{"lvl":"بسيط","t":"فرّق بين المفهومين","b":"اشرح الفرق بين «الحكومة الإلكترونية» و«الإدارة التقليدية» من الناحية القانونية تحديدًا لا التقنية، مستندًا إلى ما ورد في المحاضرة."},{"lvl":"متوسط","t":"حالة تطبيقية: خطأ في النظام","b":"دائرة حكومية سجّل نظامها الإلكتروني غيابًا غير صحيح لأحد الموظفين، فاستُقطع جزء من راتبه. حلّل هذه الحالة قانونيًا: من المسؤول؟ وما الإجراء الذي يجب أن تتيحه الدائرة لتصحيح الخطأ؟"},{"lvl":"متوسط","t":"صنّف المعوقات","b":"اختر دائرة تعرفها (أو افترضها)، واذكر لكل نوع من أنواع المعوقات الأربعة (إدارية، قانونية، تقنية ومالية، بشرية) مثالًا واقعيًا واحدًا مما قد تواجهه تلك الدائرة."},{"lvl":"متقدم","t":"مسودة ضوابط للأرشفة الإلكترونية","b":"اكتب مسودة من خمس نقاط لضوابط تنظّم الأرشفة الإلكترونية في دائرة حكومية، بحيث تغطي: سلامة الوثيقة، النسخ الاحتياطي، صلاحيات الوصول، إثبات صحة الوثيقة، وحمايتها من التعديل أو الإتلاف."},{"lvl":"متقدم","t":"من التحول الإلكتروني إلى الذكاء الاصطناعي","b":"اختر تساؤلًا واحدًا من التساؤلات القانونية التي أثارها استخدام الذكاء الاصطناعي في الوظيفة العامة (كما وردت في نهاية المحاضرة)، وناقشه في حدود نصف صفحة مستندًا إلى مبدأ استمرار خضوع الإدارة للقانون."}],"quiz":{"mcq":[{"axis":1,"q":"بحسب المحاضرة، ماذا يجب أن يدرك الموظف إلى جانب إتقان استخدام النظام الإلكتروني؟","opts":["لا شيء إضافي، الإتقان التقني كافٍ","الحدود القانونية للاستخدام وطبيعة واجباته ومسؤولياته","سرعة الكتابة على الحاسوب فقط","نوع الجهاز المستخدم فقط"],"correct":1,"explain":"الثقافة القانونية لا تقل أهمية عن الكفاءة التقنية: لا يكفي معرفة الاستخدام، بل يجب إدراك الحدود القانونية والمسؤولية المترتبة على إساءة الاستخدام."},{"axis":2,"q":"الإدارة الإلكترونية تقوم على عنصرين أساسيين هما:","opts":["المالي والإداري","التقني والبشري","القانوني والسياسي","المحلي والدولي"],"correct":1,"explain":"العنصر التقني (أجهزة وبرامج وشبكات) والعنصر البشري (موظفون مؤهلون) هما ركيزتا الإدارة الإلكترونية كما ورد في المحور الثاني."},{"axis":3,"q":"من أبرز نتائج الانتقال إلى الإدارة الإلكترونية وفق المحاضرة:","opts":["إلغاء دور الموظف نهائيًا","توسيع المشاركة الوظيفية وإعادة تنظيم أساليب العمل","تعطيل الرقابة الإدارية بالكامل","إلغاء جميع القواعد القانونية القديمة"],"correct":1,"explain":"الانتقال يمكّن من مشاركة أوسع للموظفين وإعادة تنظيم أساليب العمل وإجراءات إنجاز المعاملات بما يلائم البيئة الرقمية."},{"axis":4,"q":"الحكومة الإلكترونية بحسب المحاضرة:","opts":["تعني إنشاء حكومة جديدة مختلفة قانونيًا عن الحكومة التقليدية","تعني أداء الدولة وظائفها التقليدية بوسائل إلكترونية حديثة","تلغي اختصاص الجهات الإدارية القائمة","تحل محل السلطة التشريعية"],"correct":1,"explain":"النص: «الحكومة الإلكترونية لا تعني إنشاء حكومة جديدة... وإنما تعني أن الدولة تؤدي وظائفها التقليدية باستخدام وسائل إلكترونية حديثة»."},{"axis":5,"q":"أيّ مما يلي لم يُذكر ضمن تطبيقات التطور الإلكتروني في المحاضرة؟","opts":["الرواتب والمخصصات","الأرشفة الإلكترونية","الانتخابات الرئاسية الإلكترونية","إدارة شؤون الموظفين"],"correct":2,"explain":"التطبيقات المذكورة هي: الرواتب، الإجازات، الترقيات، شؤون الموظفين، المخازن، المشتريات، المراسلات، الأرشفة، حفظ البيانات، ومتابعة المعاملات — ولم تُذكر الانتخابات."},{"axis":5,"q":"إذا سجّل النظام الإلكتروني خطأً أدى إلى استقطاع من راتب موظف، فإن هذا الخطأ:","opts":["يبقى مسألة تقنية بحتة لا علاقة للقانون بها","ينعكس مباشرة على حق مالي للموظف ويستوجب آلية قانونية وإدارية لتصحيحه","لا يمكن تصحيحه لأن النظام الإلكتروني معصوم من الخطأ","من مسؤولية الموظف نفسه حصرًا"],"correct":1,"explain":"دقة البيانات الإلكترونية وسلامتها مسألة قانونية لأنها ترتب حقوقًا والتزامات."},{"axis":6,"q":"من الأسئلة القانونية الجديدة التي تثيرها البيئة الإلكترونية بحسب المحاضرة:","opts":["ما لون واجهة النظام؟","ما القيمة القانونية للمستند الإلكتروني؟","كم عدد الموظفين في الإدارة؟","ما نوع الحاسوب المستخدم؟"],"correct":1,"explain":"من الأسئلة الست في المحور السادس: القيمة القانونية للمستند الإلكتروني، وتحديد من أدخل البيانات، وحجية المراسلات في الإثبات، والتحقق من الهوية، وصلاحية الوصول، والمسؤولية عن التعديل غير المشروع."},{"axis":6,"q":"من صور الأفعال غير المشروعة في البيئة الإلكترونية بحسب المحاضرة:","opts":["تحديث البرامج بصورة دورية","الدخول غير المصرّح به إلى الأنظمة أو البيانات","إنشاء نسخة احتياطية من الوثائق","تدريب الموظفين على استخدام الأنظمة"],"correct":1,"explain":"الدخول غير المصرّح به من صور الأفعال غير المشروعة، إلى جانب إتلاف البيانات والبرامج وتعطيل الأجهزة وانتحال الشخصية."},{"axis":7,"q":"ما التحدي الذي يخلقه اعتماد المرفق العام على الأنظمة الإلكترونية بحسب المحاضرة؟","opts":["لا توجد أي تحديات مطلقًا","تحدٍّ يتعلق بمبدأ استمرار المرفق العام بانتظام واطراد","زيادة عدد الموظفين بشكل مبالغ فيه","ارتفاع الإنتاجية فقط دون أي مخاطر"],"correct":1,"explain":"الاعتماد على التقنية يخلق تحديًا يتعلق بمبدأ استمرار المرفق العام بانتظام واطراد، إذ قد يؤدي توقف النظام أو اختراق الشبكة إلى اضطراب الخدمة."},{"axis":8,"q":"من إيجابيات التحول الإلكتروني في مجال الرقابة بحسب المحاضرة:","opts":["صعوبة تحديد الموظف الذي قام بإجراء معين","تسجيل وقت الدخول ونوع الإجراء والشخص الذي قام به","إلغاء الرقابة كليًا","تعطيل عمل الجهات الرقابية"],"correct":1,"explain":"النظام الإلكتروني يمكنه تسجيل وقت الدخول ونوع الإجراء والشخص الذي قام به ووقت إحالة المعاملة، خلافًا لصعوبة ذلك في الإدارة الورقية."},{"axis":9,"q":"كم عدد أنواع المعوقات التي صنّفتها المحاضرة للتحول الإلكتروني؟","opts":["اثنان","ثلاثة","أربعة","خمسة"],"correct":2,"explain":"أربعة أنواع: معوقات إدارية-تنظيمية، وقانونية، وتقنية-مالية، وبشرية."},{"axis":9,"q":"ضعف الوعي الإلكتروني ومقاومة بعض الموظفين للتغيير يندرجان تحت أي نوع من المعوقات؟","opts":["معوقات قانونية","معوقات بشرية","معوقات تقنية-مالية","معوقات إدارية-تنظيمية"],"correct":1,"explain":"هذان العاملان من صميم المعوقات البشرية إلى جانب قلة الكوادر المتخصصة وضعف التدريب."},{"axis":10,"q":"من التساؤلات القانونية التي يطرحها استخدام الذكاء الاصطناعي في الوظيفة العامة وفق المحاضرة:","opts":["من يتحمل المسؤولية عن الخطأ الذي ينتج عن نظام يعتمد على الذكاء الاصطناعي؟","ما هو سعر الحاسوب المستخدم؟","كم عدد ساعات العمل الرسمية؟","ما نوع لوحة المفاتيح المستخدمة؟"],"correct":0,"explain":"من أبرز الأسئلة الستة: المسؤولية عن الخطأ الخوارزمي، وجواز الاعتماد على القرار الذكي، وحدود الرقابة البشرية، وضمان عدم التحيّز، وحماية البيانات، وحدود واجب المراجعة."},{"axis":11,"q":"ما القاعدة الأساسية التي ختمت بها المحاضرة؟","opts":["التقنية تحل محل القانون كليًا","التحول الرقمي يغيّر وسيلة الأداء لكنه لا يُلغي الخضوع للقانون","لا حاجة لتطوير القواعد القانونية مطلقًا","يجب إلغاء الوظيفة العامة التقليدية"],"correct":1,"explain":"القاعدة الختامية: التحول الرقمي يغيّر وسيلة أداء الوظيفة العامة، لكنه لا يلغي خضوع الإدارة والموظف للقانون؛ بل يفرض تطوير القواعد القانونية."},{"axis":11,"q":"نجاح التحول الإلكتروني بحسب خاتمة المحاضرة يتطلب الجمع بين:","opts":["السرعة والفوضى الإدارية","الكفاءة التقنية والمشروعية القانونية","تقليل عدد الموظفين فقط دون أي إجراء آخر","إلغاء الرقابة الإدارية"],"correct":1,"explain":"الخاتمة: يتطلب النجاح الجمع بين الكفاءة التقنية والمشروعية القانونية، عبر تطوير الإجراءات وتأهيل الموظفين وحماية البيانات وضبط الصلاحيات."}],"tf":[{"axis":1,"s":"التحول في وسيلة أداء الوظيفة العامة يعني التحلل من أحكام القانون.","correct":false,"explain":"النص صريح: التحول «لا يعني التحلل من أحكام القانون، وإنما يفرض إعادة النظر في كيفية تطبيق بعض القواعد القانونية التقليدية»."},{"axis":2,"s":"اختفاء الموظف العام هو المقصود بمفهوم التطور الإلكتروني في الإدارة.","correct":false,"explain":"المقصود تغيّر طريقة أداء الموظف لمهامه وواجباته، لا اختفاء دوره."},{"axis":2,"s":"التقنية في الإدارة الإلكترونية تُعد بديلًا عن القانون الذي يحكم النشاط الإداري.","correct":false,"explain":"النص واضح: «التقنية تظل وسيلة لأداء النشاط الإداري وليست بديلًا عن القانون الذي يحكم هذا النشاط»."},{"axis":3,"s":"يجب أن يواكب الانتقال إلى الإدارة الإلكترونية حماية حقوق الأفراد التي كفلها القانون.","correct":true,"explain":"صحيح — أكدت المحاضرة ضرورة أن يواكب هذا الانتقال حماية القانون وحقوق ومصالح الأفراد التي وضعها المشرّع."},{"axis":4,"s":"تؤثر الحكومة الإلكترونية في الوظيفة العامة من الناحية التنظيمية فقط دون أي بُعد قانوني.","correct":false,"explain":"غير صحيح — تؤثر من ناحيتين: تنظيمية (تغيّر أساليب العمل والهياكل) وقانونية (صحة الإجراءات وحماية البيانات والاختصاص والمسؤولية)."},{"axis":5,"s":"دقة البيانات المحفوظة إلكترونيًا تُعد مسألة قانونية وليست مجرد مسألة تقنية.","correct":true,"explain":"صحيح — مثال الاستقطاع الخاطئ من الراتب يوضح أن خطأ النظام ينعكس مباشرة على حق مالي للموظف، مما يجعل دقة البيانات مسألة قانونية."},{"axis":6,"s":"الموظف الذي يتجاوز صلاحياته الإلكترونية أو يفشي المعلومات لا يتحمل أي مسؤولية قانونية.","correct":false,"explain":"غير صحيح — النص يوضح أن ذلك «قد يرتكب مخالفة تستوجب مساءلته وفقًا للقواعد القانونية النافذة»."},{"axis":7,"s":"صيانة الأنظمة والنسخ الاحتياطي وخطط الطوارئ وتأهيل الموظفين مسائل غير ضرورية لضمان استمرار المرفق العام.","correct":false,"explain":"غير صحيح — النص يعتبرها مسائل «ترتبط بصورة مباشرة بضمان استمرار المرفق العام في أداء وظائفه»."},{"axis":8,"s":"ينبغي أن تتحول الرقابة الإلكترونية إلى وسيلة غير محدودة للتدخل في خصوصية الموظف.","correct":false,"explain":"غير صحيح — يجب التوازن بين حق الإدارة في الرقابة وحق الموظف في الخصوصية، وفي الحدود التي يسمح بها القانون."},{"axis":9,"s":"قصور التشريعات عن مواكبة التوقيع الإلكتروني والإثبات وحماية البيانات يُعد من المعوقات القانونية.","correct":true,"explain":"صحيح — هذا بالضبط تعريف المعوقات القانونية الوارد في المحور التاسع."},{"axis":10,"s":"اعتبرت المحاضرة أن مسائل الذكاء الاصطناعي في الوظيفة العامة لا تحتاج إلى أي دراسة قانونية مستقلة.","correct":false,"explain":"غير صحيح — النص ينص على أنها «تحتاج إلى دراسة مستقلة نظرًا لما تثيره من إشكالات قانونية»."},{"axis":11,"s":"لا يفقد القرار الإداري طبيعته القانونية لمجرد صدوره أو تبليغه بوسيلة إلكترونية.","correct":true,"explain":"صحيح — نص صريح في الخاتمة يؤكد استمرار الطبيعة القانونية للقرار الإداري بصرف النظر عن وسيلة إصداره."}],"scenario":[{"axis":5,"q":"سجّل النظام الإلكتروني لأحد الموظفين تغيّبًا عن العمل نتيجة خطأ تقني، فتم استقطاع جزء من راتبه دون علمه. هل يبقى هذا خطأً تقنيًا بحتًا؟ وما الآلية الواجب توافرها لمعالجته، ومن يتحمل المسؤولية؟","model":"لا يبقى الخطأ محصورًا داخل النظام كمسألة تقنية بحتة؛ لأنه انعكس مباشرة على حق مالي للموظف (استقطاع من راتبه)، وهو ما يجعله مسألة قانونية بامتياز، تمامًا كما أوضح المثال التوضيحي في المحاضرة. ويجب أن تتوافر آلية قانونية وإدارية لمراجعة البيانات المسجّلة في النظام وتصحيحها، ورد المبلغ المستقطع خطأً، وتحديد الجهة أو الشخص المسؤول عن الخطأ (سواء كان خللًا في تصميم النظام أو خطأً في إدخال البيانات)، وذلك حماية لحق الموظف ووفقًا للقواعد القانونية النافذة.","points":[{"t":"الخطأ لا يبقى تقنيًا بحتًا؛ لأنه انعكس مباشرة على حق مالي للموظف فصار مسألة قانونية.","k":["حق مالي","قانوني","راتب","استقطاع","ينعكس","مالي"]},{"t":"وجوب توافر آلية قانونية وإدارية لمراجعة البيانات المسجّلة وتصحيحها ورد المبلغ المستقطع.","k":["الية","مراجعة","تصحيح","رد المبلغ","بيانات"]},{"t":"تحديد الجهة أو الشخص المسؤول عن الخطأ (خلل في تصميم النظام أو خطأ في إدخال البيانات).","k":["مسؤول","المسؤولية","ادخال","تصميم","تحديد"]},{"t":"الهدف حماية حق الموظف وفقًا للقواعد القانونية النافذة.","k":["حماية","حق الموظف","النافذة","القواعد"]}]},{"axis":6,"q":"موظف يملك صلاحية دخول إلى نظام إلكتروني حكومي قام بنسخ بيانات سرّية متعلقة بمواطنين ونقلها إلى جهة خارجية دون إذن. حلّل الموقف في ضوء ما ورد عن أمن المعلومات والمسؤولية الوظيفية.","model":"يمثّل هذا الفعل صورة من صور الأفعال غير المشروعة في البيئة الإلكترونية التي أشارت إليها المحاضرة، وتحديدًا إفشاء المعلومات دون إذن، وهو ما يخالف متطلبات أمن المعلومات (المحافظة على سرّية المعلومات، ومنع الإفشاء أو النقل غير المصرّح به). ومجرد امتلاك الموظف صلاحية الدخول إلى النظام لا يبرر تجاوز حدود استخدام هذه الصلاحية؛ فالموظف يبقى مسؤولًا عن احترام حدود وظيفته وصلاحياته، وهذا الفعل يُعد مخالفة تستوجب مساءلته وفقًا للقواعد القانونية النافذة المتعلقة بحماية البيانات وسرّية المعلومات.","points":[{"t":"الفعل صورة من صور الأفعال غير المشروعة في البيئة الإلكترونية: إفشاء المعلومات ونقلها دون إذن.","k":["افشاء","غير مشروع","دون اذن","نقل","سري"]},{"t":"يخالف متطلبات أمن المعلومات: المحافظة على السرّية ومنع النقل أو التعديل غير المصرّح به.","k":["امن المعلومات","سري","غير المصرح","منع"]},{"t":"امتلاك صلاحية الدخول لا يبرر تجاوز حدود استخدامها؛ الموظف مسؤول عن احترام حدود وظيفته.","k":["صلاحي","تجاوز","حدود","لا يبرر"]},{"t":"الفعل يستوجب المساءلة القانونية وفق القواعد النافذة المتعلقة بحماية البيانات.","k":["مساءل","مسؤولية","قانون","حماية البيانات"]}]},{"axis":7,"q":"تعرّضت شبكة إحدى الدوائر الحكومية للاختراق، مما أدى إلى توقف خدمة إلكترونية عن المواطنين لعدة أيام. اربط الموقف بمفهوم استمرار المرفق العام، واذكر الإجراءات الوقائية التي أشارت إليها المحاضرة.","model":"يمسّ هذا الموقف مباشرة مبدأ استمرار المرفق العام بانتظام واطراد؛ إذ إن اعتماد الخدمة بصورة أساسية على الأنظمة الإلكترونية يجعلها عرضة للتوقف أو الاضطراب عند تعرّض الشبكة للاختراق أو فقدان البيانات، كما أوضحت المحاضرة. وقد أشارت المحاضرة إلى أن ضمان استمرار المرفق العام يستلزم صيانة الأنظمة، وحماية البيانات، وإنشاء نسخ احتياطية، ووضع خطط للطوارئ، وتأهيل الموظفين، باعتبارها مسائل ترتبط بصورة مباشرة باستمرار المرفق في أداء وظائفه.","points":[{"t":"الموقف يمسّ مباشرة مبدأ استمرار المرفق العام بانتظام واطراد.","k":["استمرار","المرفق","انتظام","اطراد"]},{"t":"الاعتماد الأساسي على الأنظمة الإلكترونية يجعل الخدمة عرضة للتوقف عند الاختراق أو فقدان البيانات.","k":["اختراق","توقف","فقدان","اعتماد","اضطراب"]},{"t":"الإجراءات الوقائية: صيانة الأنظمة وحماية البيانات وإنشاء النسخ الاحتياطية.","k":["صيان","نسخ","احتياطي","حماية البيانات"]},{"t":"وضع خطط للطوارئ وتأهيل الموظفين لضمان استمرار المرفق في أداء وظائفه.","k":["طوارئ","تاهيل","خطط","تدريب"]}]},{"axis":10,"q":"طوّرت إحدى الجهات نظامًا يعتمد على الذكاء الاصطناعي لاتخاذ قرار آلي بشأن ترقية الموظفين بناءً على تحليل بياناتهم الوظيفية. ناقش المخاطر القانونية المحتملة لهذا القرار.","model":"يثير هذا السيناريو عدة تساؤلات وردت في المحاضرة؛ فمن جهة، من يتحمل المسؤولية إذا صدر قرار الترقية أو رفضها بصورة خاطئة نتيجة خلل في النظام؟ ومن جهة أخرى، هل يجوز الاعتماد على النظام الذكي في اتخاذ قرار يمسّ المركز القانوني للموظف (كالترقية) دون رقابة بشرية كافية؟ كما يثار التساؤل عن حدود ضمان عدم تحيّز الخوارزمية المستخدمة في تحليل بيانات الموظفين، وكيفية حماية هذه البيانات من الاستخدام أو الإفشاء غير المشروع. وتؤكد المحاضرة أن مثل هذه المسائل تحتاج إلى دراسة قانونية مستقلة نظرًا لحساسيتها وأثرها المباشر على حقوق الموظفين.","points":[{"t":"تحديد المسؤولية إذا صدر قرار الترقية أو رفضها بصورة خاطئة نتيجة خلل في النظام.","k":["مسؤولي","خطا","خلل","ترقي"]},{"t":"مدى جواز الاعتماد على النظام الذكي في قرار يمسّ المركز القانوني للموظف دون رقابة بشرية كافية.","k":["رقابة بشري","المركز القانوني","اشراف","جواز"]},{"t":"ضمان عدم تحيّز الخوارزمية المستخدمة في تحليل بيانات الموظفين.","k":["تحيز","خوارزم","عدال","ضمان"]},{"t":"حماية بيانات الموظفين من الاستخدام أو الإفشاء غير المشروع.","k":["حماية البيانات","افشاء","سري"]},{"t":"هذه المسائل تحتاج إلى دراسة قانونية مستقلة لحساسيتها وأثرها على حقوق الموظفين.","k":["دراس","مستقل","حقوق"]}]},{"axis":6,"q":"موظف استخدم صلاحياته الإلكترونية للاطلاع على بيانات زميل لا علاقة لها بعمله، ثم شاركها مع شخص آخر داخل الدائرة. كيّف هذا التصرف قانونيًا وفق ما ورد في المحاضرة.","model":"هذا تصرف يتجاوز حدود الصلاحيات الإلكترونية الممنوحة للموظف، ويندرج ضمن صور الإخلال بواجب المحافظة على سرّية المعلومات والوصول غير المصرّح به الذي أشارت إليه المحاضرة. فالصلاحية تُمنح للغرض الوظيفي المشروع وحده، ولا يبرر مجرد امتلاكها استعمالها في غير هذا الغرض، وهو ما يستوجب المساءلة وفق القواعد القانونية النافذة.","points":[{"t":"التصرف يتجاوز حدود الصلاحيات الإلكترونية الممنوحة للموظف.","k":["تجاوز","صلاحي","حدود"]},{"t":"يندرج ضمن الإخلال بواجب المحافظة على سرّية المعلومات والوصول غير المصرّح به.","k":["سري","وصول","غير المصرح","اخلال"]},{"t":"استخدام الصلاحية لغير الغرض الوظيفي المشروع لا يبرره مجرد امتلاكها.","k":["الغرض","وظيفي","مشروع","لا يبرر"]},{"t":"يستوجب المساءلة وفق القواعد القانونية النافذة.","k":["مساءل","قانون","مسؤولي","النافذة"]}]},{"axis":5,"q":"دائرة حكومية اعتمدت أرشفة إلكترونية لكل معاملاتها، لكنها لم تُنشئ نسخًا احتياطية دورية، وتعرّض النظام لعطل أدى إلى فقدان جزء من الوثائق. ما أوجه القصور، وما الذي كان ينبغي توفره؟","model":"أوجه القصور تتعلق بعدم الالتزام بمتطلبات نجاح الأرشفة الإلكترونية التي أشارت إليها المحاضرة، وأبرزها إنشاء نسخ احتياطية دورية وتحديث وسائل التخزين والأجهزة والبرامج بصورة منتظمة. وقد ترتب على ذلك المساس بسلامة الوثيقة وإمكان الرجوع إليها وإثبات صحتها وحمايتها من الإتلاف، إضافة إلى غياب خطة طوارئ تضمن استمرار المرفق العام بانتظام واطراد عند تعطل النظام.","points":[{"t":"الإخلال بمتطلبات نجاح الأرشفة الإلكترونية الواردة في المحاضرة.","k":["ارشف","متطلبات","نجاح"]},{"t":"غياب النسخ الاحتياطية الدورية وتحديث وسائل التخزين والأجهزة والبرامج.","k":["نسخ","احتياطي","تحديث","تخزين"]},{"t":"المساس بسلامة الوثيقة وإمكان الرجوع إليها وإثبات صحتها وحمايتها من الإتلاف.","k":["سلام","وثيق","اثبات","اتلاف","الرجوع"]},{"t":"غياب خطة طوارئ تضمن استمرار المرفق العام بانتظام واطراد.","k":["طوارئ","استمرار","المرفق","اطراد"]}]}],"essay":[{"axis":2,"q":"اشرح لماذا يُعد التحول الإلكتروني في الوظيفة العامة امتدادًا قانونيًا وليس مجرد تطور تقني بحت، مستندًا إلى ما ورد في المحاضرة.","model":"التحول الإلكتروني ليس موضوعًا تقنيًا منفصلًا عن القانون؛ فالإدارة عند استخدام الوسائل الإلكترونية في ممارسة اختصاصاتها تظل خاضعة للقواعد القانونية التي تحكم نشاطها. فالتقنية تبقى وسيلة لأداء النشاط الإداري وليست بديلًا عن القانون، والقرار الذي يصدر إلكترونيًا يجب أن يستند إلى اختصاص قانوني. كما أن اتساع استخدام التقنية يفرز مسائل قانونية جديدة (كالقيمة القانونية للمستند الإلكتروني، والتوقيع الإلكتروني، والإثبات، وحماية البيانات) تستلزم إعادة النظر في تطبيق القواعد التقليدية ووضع تنظيم قانوني للبيئة الإلكترونية الجديدة.","points":[{"t":"الإدارة تبقى خاضعة للقواعد القانونية التي تحكم نشاطها رغم استخدام الوسائل الإلكترونية.","k":["خاضع","قانون","تحكم","نشاط"]},{"t":"التقنية وسيلة لأداء النشاط الإداري وليست بديلًا عن القانون.","k":["وسيل","بديل","تقني"]},{"t":"القرار الذي يصدر إلكترونيًا يجب أن يستند إلى اختصاص قانوني.","k":["اختصاص","قرار","يستند"]},{"t":"اتساع استخدام التقنية يفرز مسائل قانونية جديدة: قيمة المستند الإلكتروني، والتوقيع، والإثبات، وحماية البيانات.","k":["مستند","توقيع","اثبات","حماية البيانات","مسائل"]},{"t":"يستلزم ذلك إعادة النظر في تطبيق القواعد التقليدية ووضع تنظيم قانوني للبيئة الإلكترونية.","k":["اعادة النظر","تنظيم","تقليدي","تشريع"]}]},{"axis":4,"q":"وضّح العلاقة بين الحكومة الإلكترونية والوظيفة العامة من الناحيتين التنظيمية والقانونية كما وردت في المحاضرة.","model":"الحكومة الإلكترونية تعني أن الدولة تؤدي وظائفها التقليدية باستخدام وسائل إلكترونية حديثة، دون أن يعني ذلك إنشاء حكومة جديدة مختلفة قانونيًا؛ فالجهة الإدارية تبقى هي ذاتها، واختصاصاتها تستند إلى القانون، والموظف العام يبقى خاضعًا للنظام القانوني للوظيفة العامة. وتؤثر الحكومة الإلكترونية في الوظيفة العامة من ناحيتين: ناحية تنظيمية، لأنها تغيّر أساليب العمل والهياكل والإجراءات (كتنظيم بيانات الموظفين وتداول المراسلات إلكترونيًا)؛ وناحية قانونية، لأنها تثير مسائل تتعلق بصحة الإجراءات والمستندات، وحماية البيانات، والاختصاص، والمسؤولية.","points":[{"t":"الحكومة الإلكترونية لا تعني إنشاء حكومة جديدة؛ الدولة تؤدي وظائفها التقليدية بوسائل إلكترونية حديثة.","k":["جديد","وظائف","تقليدي","الدول"]},{"t":"الجهة الإدارية تبقى ذاتها واختصاصاتها تستند إلى القانون.","k":["الجهة","اختصاص","تستند","ذاتها"]},{"t":"الموظف العام يبقى خاضعًا للنظام القانوني للوظيفة العامة.","k":["الموظف","خاضع","النظام القانوني"]},{"t":"الناحية التنظيمية: تغيّر أساليب العمل والهياكل والإجراءات.","k":["تنظيمي","اساليب","هياكل","اجراءات"]},{"t":"الناحية القانونية: تثير مسائل صحة الإجراءات والمستندات وحماية البيانات والاختصاص والمسؤولية.","k":["قانوني","صح","حماية","المسؤولي"]}]},{"axis":9,"q":"ناقش أهم المعوقات التي تواجه التحول الإلكتروني في الوظيفة العامة، مبيّنًا العلاقة بين المعوقات القانونية والمعوقات البشرية.","model":"صنّفت المحاضرة معوقات التحول الإلكتروني إلى أربعة أنواع: معوقات إدارية-تنظيمية (ضعف التخطيط وتعقيد الإجراءات)، ومعوقات قانونية (قصور التشريعات عن مواكبة التطورات التكنولوجية في مسائل التوقيع الإلكتروني والإثبات وحماية البيانات)، ومعوقات تقنية-مالية (ضعف البنية التحتية وارتفاع التكاليف)، ومعوقات بشرية (ضعف الوعي الإلكتروني ومقاومة التغيير وضعف التدريب). وترتبط المعوقات القانونية بالمعوقات البشرية ارتباطًا وثيقًا؛ فحتى مع وجود تشريعات ملائمة، يبقى الموظف بحاجة إلى ثقافة قانونية توازي ثقافته التقنية، بحيث يدرك حدود صلاحياته ومسؤولياته عند التعامل مع البيانات، وإلا بقيت النصوص القانونية غير مفعّلة عمليًا.","points":[{"t":"المعوقات الإدارية والتنظيمية: ضعف التخطيط والتنسيق وتعقيد الإجراءات وعدم وضوح الاستراتيجية.","k":["اداري","تنظيمي","تخطيط","تنسيق","استراتيجي"]},{"t":"المعوقات القانونية: قصور التشريعات عن مواكبة التوقيع الإلكتروني والإثبات وحماية البيانات.","k":["قانوني","تشريع","توقيع","اثبات","قصور"]},{"t":"المعوقات التقنية والمالية: ضعف البنية التحتية وارتفاع تكاليف الإنشاء والصيانة.","k":["تقني","مالي","بني","تكاليف","صيان"]},{"t":"المعوقات البشرية: ضعف الوعي الإلكتروني ومقاومة التغيير وضعف التدريب وقلة الكوادر.","k":["بشري","وعي","مقاوم","تدريب","كوادر"]},{"t":"الربط بينهما: التقاء الثقافة القانونية بالثقافة التقنية شرط لتفعيل النصوص عمليًا.","k":["الثقافة القانوني","الثقافة التقني","التقاء","تفعيل"]}]},{"axis":10,"q":"بيّن الإشكاليات القانونية التي يثيرها استخدام الذكاء الاصطناعي في أداء الوظيفة العامة، ولماذا تحتاج إلى دراسة قانونية مستقلة بحسب المحاضرة.","model":"يثير استخدام الذكاء الاصطناعي في الوظيفة العامة تساؤلات قانونية عديدة، منها: من يتحمل المسؤولية عن الخطأ الناتج عن نظام يعتمد على الذكاء الاصطناعي؟ وهل يجوز الاعتماد على النظام الذكي في اتخاذ قرار يمسّ المركز القانوني للموظف أو المواطن؟ وما حدود الرقابة البشرية على القرارات التي تقترحها الأنظمة الذكية؟ وكيف يمكن ضمان عدم تحيّز الخوارزميات؟ وكيف تُحمى البيانات التي تستخدمها هذه الأنظمة؟ وما حدود واجب الموظف في مراجعة النتائج؟ وتحتاج هذه المسائل إلى دراسة مستقلة لأنها تمثل مستوى أكثر تعقيدًا من الإدارة الإلكترونية التقليدية التي تنفّذ إجراءات محددة مسبقًا، إذ تتجه تقنيات الذكاء الاصطناعي إلى تحليل البيانات واكتشاف الأنماط والتنبؤ والمساعدة في اتخاذ القرار، مما يثير إشكالات جديدة تتعلق بالاختصاص والمسؤولية والشفافية وحماية الحقوق.","points":[{"t":"المسؤولية عن الخطأ الناتج عن نظام يعتمد على الذكاء الاصطناعي.","k":["مسؤولي","خطا","خوارزم"]},{"t":"مدى جواز الاعتماد على النظام الذكي في قرار يمسّ المركز القانوني للموظف أو المواطن.","k":["قرار","المركز القانوني","جواز","يمس"]},{"t":"حدود الرقابة البشرية على القرارات التي تقترحها الأنظمة الذكية.","k":["رقابة بشري","حدود","اشراف"]},{"t":"ضمان عدم تحيّز الخوارزميات وحماية البيانات التي تستخدمها.","k":["تحيز","حماية البيانات","ضمان"]},{"t":"الحاجة إلى دراسة مستقلة لأن الذكاء الاصطناعي يتجاوز الأتمتة التقليدية إلى التحليل والتنبؤ والاستدلال.","k":["دراس","مستقل","تنبؤ","استدلال","تحليل"]}]},{"axis":9,"q":"ناقش العلاقة بين الثقافة القانونية والثقافة التقنية بالنسبة للموظف العام في ضوء ما ورد في المحاضرة عن المعوقات البشرية.","model":"لا يكفي أن يتقن الموظف استخدام النظام الإلكتروني من الناحية التقنية، بل ينبغي أن يعرف إلى جانب ذلك حدود صلاحياته وما يجوز له فعله وما لا يجوز، وواجباته عند التعامل مع البيانات والمعلومات، والمسؤولية القانونية المترتبة على إساءة استخدام الوسائل الإلكترونية. وهنا تلتقي الثقافة القانونية بالثقافة التقنية، وهو ما يفسّر أن معالجة المعوقات البشرية لا تتم بالتدريب التقني وحده، وإنما بالجمع بين التدريب التقني والتأهيل القانوني للموظف.","points":[{"t":"لا يكفي إتقان استخدام النظام تقنيًا.","k":["لا يكفي","تقني","اتقان","استخدام"]},{"t":"معرفة حدود الصلاحيات وما يجوز وما لا يجوز للموظف فعله.","k":["حدود","صلاحي","يجوز"]},{"t":"إدراك واجبات التعامل مع البيانات والمسؤولية المترتبة على إساءة الاستخدام.","k":["بيانات","مسؤولي","اساء","واجبات"]},{"t":"الجمع بين التدريب التقني والتأهيل القانوني شرط لتجاوز المعوقات البشرية.","k":["تدريب","تاهيل","الجمع","بشري"]}]},{"axis":10,"q":"في ضوء التساؤلات القانونية التي أثارها انتقال الوظيفة العامة نحو استخدام الذكاء الاصطناعي، اقترح ثلاثة ضوابط أساسية ينبغي أن تلتزم بها أي دائرة حكومية قبل اعتماد نظام ذكاء اصطناعي في اتخاذ قراراتها.","model":"يمكن اقتراح ثلاثة ضوابط أساسية: الأول، إبقاء القرار النهائي بيد موظف مسؤول عبر إشراف بشري فعّال، فلا يصدر قرار يمسّ المركز القانوني لأحد اعتمادًا على مخرجات النظام وحدها. والثاني، وضوح آلية تحديد المسؤولية عند وقوع الخطأ، بحيث يُعرف مسبقًا من يتحمل تبعة الخطأ الناتج عن النظام. والثالث، التحقق الدوري من عدم تحيّز النظام وحماية البيانات التي يعالجها وضبط صلاحيات الوصول إليها. وتستند هذه الضوابط جميعًا إلى مبدأ استمرار خضوع الإدارة للقانون رغم تغيّر وسيلة الأداء.","points":[{"t":"إبقاء القرار النهائي بيد موظف مسؤول (الإشراف البشري).","k":["القرار النهائي","اشراف","بشري","موظف مسؤول"]},{"t":"وضوح آلية تحديد المسؤولية عند وقوع الخطأ.","k":["الي","مسؤولي","خطا","تحديد"]},{"t":"التحقق الدوري من عدم تحيّز النظام.","k":["تحيز","تحقق","دوري"]},{"t":"حماية البيانات التي يعالجها النظام وضبط صلاحيات الوصول إليها.","k":["حماية البيانات","صلاحي","وصول","ضبط"]}]}]}},"innov":{"lectures":[{"title":"المحاضرة الأولى — الابتكار وإدارة المشاريع الرقمية ودور الابتكار في الاقتصاد الرقمي","sections":[{"h":"مقدمة","body":"<p>يشهد الاقتصاد العالمي تحولًا جوهريًا بفعل التطورات المتسارعة في التكنولوجيا الرقمية، والذكاء الاصطناعي، والحوسبة السحابية، وإنترنت الأشياء، وتحليل البيانات الضخمة، وسلاسل الكتل. ولم يعد الابتكار نشاطًا ثانويًا داخل المؤسسات، بل أصبح أحد أهم محركات النمو الاقتصادي والتنافسية والاستدامة.</p><p>وقد أدى التحول من الاقتصاد التقليدي إلى الاقتصاد الرقمي إلى ظهور نماذج أعمال جديدة، ومنصات رقمية، ومشاريع قائمة على البيانات والتكنولوجيا، الأمر الذي جعل إدارة المشاريع الرقمية تتطلب مهارات وأدوات تختلف عن إدارة المشاريع التقليدية.</p>"},{"h":"المحور الأول: مفهوم الابتكار","body":"<p><b>تعريف الابتكار (Innovation):</b> هو عملية تحويل الأفكار والمعارف الجديدة أو المطورة إلى منتجات أو خدمات أو عمليات أو نماذج أعمال تحقق قيمة اقتصادية أو اجتماعية. وبالتالي فإن الابتكار لا يعني مجرد إنتاج فكرة جديدة، وإنما يتطلب تحويل الفكرة إلى قيمة قابلة للقياس.</p><p><b>الفرق بين الإبداع والاختراع والابتكار وريادة الأعمال:</b></p><ul><li><b>الإبداع:</b> توليد فكرة جديدة ومبتكرة.</li><li><b>الاختراع:</b> إنتاج شيء أو تقنية جديدة.</li><li><b>الابتكار:</b> تحويل الفكرة أو الاختراع إلى تطبيق يخلق قيمة.</li><li><b>ريادة الأعمال:</b> استثمار الفرصة وتحويلها إلى مشروع أو نشاط اقتصادي.</li></ul><p><i>مثال:</i> ابتكار فكرة تطبيق مصرفي جديد يمثّل إبداعًا، وتطوير التكنولوجيا اللازمة للتطبيق يمثّل اختراعًا أو تطويرًا تقنيًا، أما طرح التطبيق في السوق وتحقيق قيمة للعملاء والمؤسسة فهو الابتكار.</p>"},{"h":"المحور الثاني: أنواع الابتكار","body":"<p>يمكن تصنيف الابتكار إلى مجموعة من الأنواع، أهمها:</p><ul><li><b>ابتكار المنتجات:</b> إنتاج سلعة جديدة أو تطوير سلعة قائمة.</li><li><b>ابتكار الخدمات:</b> تقديم خدمة جديدة أو تحسين طريقة تقديم الخدمة.</li><li><b>ابتكار العمليات:</b> تطوير أساليب الإنتاج أو الإدارة أو التوزيع.</li><li><b>الابتكار التنظيمي:</b> إحداث تغييرات في الهيكل التنظيمي أو أساليب الإدارة.</li><li><b>ابتكار نموذج الأعمال:</b> إعادة تصميم الطريقة التي تحقق بها المؤسسة الإيرادات وتقدّم القيمة للعملاء.</li><li><b>الابتكار الرقمي:</b> استخدام التكنولوجيا الرقمية لإنتاج أو تطوير قيمة جديدة من منتجات وخدمات وعمليات ونماذج أعمال.</li></ul>"},{"h":"المحور الثالث: مفهوم الاقتصاد الرقمي","body":"<p>يُقصد بالاقتصاد الرقمي الاقتصاد الذي تعتمد أنشطته بصورة متزايدة على البيانات والتقنيات والبنية التحتية الرقمية في إنتاج السلع والخدمات وتبادلها واستهلاكها. ومن أهم مكوناته: البنية التحتية الرقمية، البيانات، المنصات الرقمية، التجارة الإلكترونية، الخدمات المالية الرقمية، الذكاء الاصطناعي، الحوسبة السحابية، إنترنت الأشياء، الأمن السيبراني، والحكومة الإلكترونية.</p><h4>مقارنة: الاقتصاد التقليدي مقابل الاقتصاد الرقمي</h4><div class='hp-cmp-wrap'><table class='hp-cmp'><thead><tr><th>الاقتصاد التقليدي</th><th>الاقتصاد الرقمي</th></tr></thead><tbody><tr><td>الاعتماد على الأصول المادية</td><td>الاعتماد المتزايد على البيانات والمعرفة</td></tr><tr><td>الأسواق المكانية</td><td>الأسواق والمنصات الإلكترونية</td></tr><tr><td>العمليات الورقية</td><td>العمليات الرقمية</td></tr><tr><td>القرارات البطيئة</td><td>القرارات المعتمدة على البيانات في الوقت الحقيقي</td></tr><tr><td>قنوات توزيع تقليدية</td><td>منصات رقمية</td></tr><tr><td>الابتكار أبطأ نسبيًا</td><td>الابتكار سريع ومتواصل</td></tr></tbody></table></div>"},{"h":"المحور الرابع: دور الابتكار في الاقتصاد الرقمي","body":"<p>يمثّل الابتكار المحرك الأساسي للاقتصاد الرقمي من خلال مجموعة من القنوات:</p><p><b>١. زيادة الإنتاجية:</b> يسهم الابتكار الرقمي في أتمتة العمليات وتقليل الوقت والتكاليف ورفع كفاءة استخدام الموارد.</p><p><b>٢. خلق منتجات وخدمات جديدة:</b> أدى الابتكار الرقمي إلى ظهور المحافظ الإلكترونية، والخدمات المصرفية الرقمية، والتعليم الإلكتروني، والصحة الرقمية، والتجارة الإلكترونية، والمنصات الرقمية، والخدمات الحكومية الإلكترونية.</p><p><b>٣. خلق فرص عمل جديدة:</b> ظهرت مهن ووظائف جديدة مثل محلل البيانات، ومطوّر التطبيقات، ومهندس الذكاء الاصطناعي، وخبير الأمن السيبراني، ومختص التسويق الرقمي.</p><p><b>٤. تعزيز التنافسية:</b> المؤسسات التي تمتلك قدرة ابتكارية رقمية تستطيع الاستجابة بسرعة أكبر لتغيرات السوق واحتياجات المستهلكين.</p><p><b>٥. دعم ريادة الأعمال:</b> خفّضت التكنولوجيا الرقمية تكاليف تأسيس المشاريع، وسمحت للمشروعات الصغيرة بالوصول إلى أسواق واسعة.</p><p><b>٦. تحقيق الشمول المالي:</b> يمكن للخدمات المالية الرقمية أن تسهم في توسيع الوصول إلى الخدمات المصرفية والمالية للفئات التي لا تحصل عليها بصورة كافية.</p>"},{"h":"المحور الخامس: المشاريع الرقمية","body":"<p>المشروع الرقمي هو مشروع يعتمد بصورة أساسية على التكنولوجيا الرقمية أو البيانات أو المنصات الرقمية في إنشاء القيمة وتقديم المنتجات أو الخدمات. ومن أمثلته: تطبيقات الهاتف المحمول، منصات التجارة الإلكترونية، شركات التكنولوجيا المالية (FinTech)، منصات التعليم الإلكتروني، تطبيقات النقل الذكي، مشاريع الذكاء الاصطناعي، والمنصات الحكومية الرقمية.</p><p><b>خصائص المشاريع الرقمية:</b> سرعة التغيير، ارتفاع مستوى عدم اليقين، الاعتماد الكبير على البيانات، الحاجة إلى الابتكار المستمر، إمكانية التوسع السريع، الاعتماد على فرق متعددة التخصصات، ارتفاع أهمية الأمن السيبراني، وارتباط النجاح بتجربة المستخدم.</p>"},{"h":"المحور السادس: إدارة المشاريع الرقمية","body":"<p>إدارة المشاريع الرقمية هي تطبيق مبادئ وأدوات إدارة المشاريع على المشاريع التي تعتمد على التكنولوجيا الرقمية، مع مراعاة طبيعة هذه المشاريع من حيث السرعة والتغيّر المستمر وعدم اليقين.</p><p><b>أهم مراحل المشروع الرقمي:</b></p><p>١. تحديد المشكلة أو الفرصة — ما المشكلة التي يسعى المشروع إلى حلها؟</p><p>٢. توليد الفكرة — إيجاد حلول مبتكرة للمشكلة.</p><p>٣. دراسة الجدوى — تحليل الجدوى الاقتصادية، والجدوى الفنية، والجدوى التسويقية، والجدوى القانونية، والمخاطر.</p><p>٤. تصميم المنتج الأولي — إنشاء نموذج أولي (Prototype).</p><p>٥. الاختبار — اختبار المنتج مع المستخدمين وجمع التغذية الراجعة.</p><p>٦. التنفيذ — تحويل النموذج إلى منتج أو خدمة قابلة للاستخدام.</p><p>٧. الإطلاق — طرح المنتج في السوق.</p><p>٨. التقييم والتطوير — قياس الأداء وإجراء التحسينات المستمرة.</p>"},{"h":"المحور السابع: منهجية Agile في إدارة المشاريع الرقمية","body":"<p>تُعد منهجية Agile من أهم المنهجيات المستخدمة في إدارة المشاريع الرقمية، وتقوم على: التطوير المرحلي، العمل ضمن فرق صغيرة، سرعة الاستجابة للتغيير، التواصل المستمر مع المستخدم، الاختبار المتكرر، والتحسين المستمر.</p><p>ومن أشهر تطبيقاتها منهجية <b>Scrum</b>، التي تعتمد على دورات تطوير قصيرة تُسمى Sprints، يتم خلالها تطوير أجزاء محددة من المنتج ثم اختبارها وتحسينها.</p><p><b>لماذا تُعد Agile مناسبة للمشاريع الرقمية؟</b> لأن البيئة الرقمية تتصف بسرعة تغيّر التكنولوجيا والمنافسة وسلوك المستهلك واحتياجات السوق، لذلك فإن التخطيط الجامد طويل الأجل قد لا يكون مناسبًا دائمًا للمشروعات الرقمية.</p>"},{"h":"المحور الثامن: التكنولوجيا كمحرك للابتكار","body":"<p>هناك مجموعة من التقنيات التي أصبحت محركات رئيسة للابتكار، منها:</p><p><b>الذكاء الاصطناعي (AI):</b> يسهم في تحليل البيانات، والتنبؤ، والأتمتة، ودعم اتخاذ القرار، وتطوير الخدمات الذكية.</p><p><b>البيانات الضخمة (Big Data):</b> تمكّن المؤسسات من اكتشاف أنماط سلوك العملاء والأسواق.</p><p><b>الحوسبة السحابية (Cloud Computing):</b> تخفّض الحاجة إلى استثمارات ضخمة في البنية التحتية التقنية.</p><p><b>إنترنت الأشياء (IoT):</b> يربط الأجهزة والمعدات والأنظمة عبر شبكات رقمية لجمع البيانات وتبادلها.</p><p><b>سلسلة الكتل (Blockchain):</b> يمكن استخدامها في التحقق من المعاملات، والعقود الذكية، وتتبّع العمليات، وتعزيز الشفافية.</p><p><b>التكنولوجيا المالية (FinTech):</b> أحدثت تحولًا كبيرًا في المدفوعات والتحويلات والتمويل والخدمات المصرفية والاستثمار.</p>"},{"h":"المحور التاسع: الابتكار وريادة الأعمال الرقمية","body":"<p>توجد علاقة وثيقة بين الابتكار وريادة الأعمال؛ فالابتكار يولّد الفرصة، وريادة الأعمال تحوّل الفرصة إلى مشروع. ويمكن التعبير عن ذلك بالنموذج التالي:</p><div class='hp-formula'>فكرة ← ابتكار ← فرصة اقتصادية ← مشروع رقمي ← قيمة اقتصادية ← نمو وتوسع</div><p>ومن هنا أصبحت الشركات الناشئة الرقمية من أهم مصادر الابتكار في الاقتصادات الحديثة.</p>"},{"h":"المحور العاشر: الابتكار المفتوح","body":"<p>يعني الابتكار المفتوح (Open Innovation) اعتماد المؤسسة على مصادر داخلية وخارجية للمعرفة والأفكار والتكنولوجيا، بدلًا من الاعتماد الحصري على قدراتها الداخلية. ومن مصادر الابتكار المفتوح: الجامعات، مراكز البحوث، الشركات الناشئة، العملاء، المستثمرون، الحاضنات التكنولوجية، والمختبرات الابتكارية.</p><p>وهنا تبرز أهمية الجامعة الريادية في دعم الاقتصاد الرقمي من خلال تحويل المعرفة والبحوث إلى مشاريع وشركات ناشئة.</p>"},{"h":"المحور الحادي عشر: تحديات الابتكار والمشاريع الرقمية","body":"<p>تواجه المشاريع الرقمية مجموعة من التحديات، أهمها: نقص المهارات الرقمية، ضعف التمويل، مقاومة التغيير، ضعف البنية التحتية الرقمية، المخاطر السيبرانية، حماية البيانات والخصوصية، عدم وضوح بعض الأطر التنظيمية، سرعة تغيّر التكنولوجيا، شدة المنافسة، وصعوبة تحقيق الاستدامة المالية لبعض الشركات الناشئة.</p>"},{"h":"المحور الثاني عشر: الابتكار والاقتصاد الرقمي في العراق","body":"<p>يمثّل العراق بيئة مهمة لتطبيق الابتكار الرقمي، خصوصًا في ظل الحاجة إلى تنويع الاقتصاد وتقليل الاعتماد على القطاعات التقليدية. ويمكن توجيه الابتكار الرقمي نحو قطاعات عديدة، منها:</p><p><b>القطاع المصرفي</b> من خلال: الخدمات المصرفية الرقمية، المدفوعات الإلكترونية، التكنولوجيا المالية، والذكاء الاصطناعي في إدارة المخاطر.</p><p><b>التعليم</b> من خلال: التعليم الإلكتروني، منصات التعلم الذكية، والذكاء الاصطناعي في التعليم والبحث العلمي.</p><p><b>الصناعة</b> من خلال: الأتمتة، إنترنت الأشياء، الصيانة التنبؤية، والتصنيع الذكي.</p><p><b>الزراعة</b> من خلال: الزراعة الذكية، الاستشعار عن بعد، وتحليل البيانات المناخية.</p><p><b>إدارة الموارد المائية</b> والحكومة من خلال: الحكومة الإلكترونية، الخدمات الحكومية الرقمية، قواعد البيانات الموحدة، وأتمتة الإجراءات.</p>"},{"h":"المحور الثالث عشر: نموذج متكامل للابتكار الرقمي","body":"<p>يمكن للطلبة تحليل أي مشروع رقمي باستخدام النموذج التالي:</p><div class='hp-formula'>المشكلة ← الفكرة ← الابتكار ← التكنولوجيا ← نموذج الأعمال ← المشروع الرقمي ← السوق ← القيمة الاقتصادية ← الاستدامة</div><p>ويجب عند تحليل المشروع الإجابة عن الأسئلة الآتية: ما المشكلة التي يحلها المشروع؟ ما القيمة المضافة التي يقدمها؟ ما درجة الابتكار؟ ما التكنولوجيا المستخدمة؟ من هم العملاء المستهدفون؟ كيف يحقق المشروع الإيرادات؟ ما المخاطر؟ كيف يمكن التوسع؟ وكيف نقيس نجاح المشروع؟ وما أثر المشروع في الاقتصاد والمجتمع؟</p>"},{"h":"المحور الرابع عشر: مؤشرات قياس الابتكار الرقمي","body":"<p>يمكن قياس أداء الابتكار من خلال مؤشرات كمية ونوعية، منها: عدد الابتكارات الجديدة، الإنفاق على البحث والتطوير، عدد براءات الاختراع، عدد الشركات الناشئة، حجم الاستثمار في التكنولوجيا، نسبة الخدمات الرقمية، عدد المستخدمين للمنصات الرقمية، نمو الإيرادات الرقمية، إنتاجية العاملين، مستوى رضا العملاء، وسرعة إطلاق المنتجات الجديدة.</p>"},{"h":"المحور الخامس عشر: دراسة حالة تطبيقية — منصة مصرفية رقمية عراقية","body":"<p>لنفترض قيام مصرف عراقي بتطوير منصة رقمية متكاملة تسمح للعميل بـ: فتح الحساب إلكترونيًا، إجراء التحويلات، دفع الفواتير، إدارة البطاقات، الحصول على تمويل رقمي، وتلقّي إشعارات ذكية.</p><p><b>الأسئلة التحليلية للطلبة:</b></p><p>السؤال الأول: أين يظهر الابتكار في المشروع؟</p><p>السؤال الثاني: ما التكنولوجيا المطلوبة لتنفيذ المشروع؟</p><p>السؤال الثالث: ما المخاطر التي يمكن أن تواجه المشروع؟</p><p>السؤال الرابع: كيف يمكن استخدام الذكاء الاصطناعي في المنصة؟</p><p>السؤال الخامس: كيف يمكن قياس الأثر الاقتصادي للمشروع؟</p><p>السؤال السادس: ما العوامل التي تحدد نجاح المشروع واستدامته؟</p>"},{"h":"المحور السادس عشر: العلاقة بين الابتكار والاستدامة الاقتصادية","body":"<p>لا ينبغي النظر إلى الابتكار الرقمي باعتباره وسيلة لزيادة الأرباح فقط، وإنما باعتباره أداة لتحقيق الاستدامة الاقتصادية والاجتماعية والبيئية:</p><div class='hp-formula'>زيادة الإنتاجية + خفض التكاليف + تحسين الموارد + خلق وظائف + دعم المنافسة + تحسين الخدمات = نمو اقتصادي مستدام</div><p><b>أسئلة نقاش للدراسات العليا:</b> هل كل ابتكار رقمي يؤدي بالضرورة إلى نمو اقتصادي؟ ما الفرق بين التحول الرقمي والابتكار الرقمي؟ هل يمكن للمؤسسات التقليدية أن تصبح مؤسسات مبتكرة دون تغيير ثقافتها التنظيمية؟ ما دور الجامعات في بناء الاقتصاد الرقمي؟ كيف يمكن للعراق الاستفادة من الذكاء الاصطناعي في تنويع مصادر الدخل؟ ما أثر التكنولوجيا المالية في هيكل القطاع المصرفي العراقي؟ وهل Agile أفضل من الأساليب التقليدية في جميع المشاريع الرقمية؟</p>"},{"h":"خلاصة المحاضرة والمعادلة الأساسية","body":"<p>يمكن تلخيص الفكرة الأساسية للمحاضرة في أن الاقتصاد الرقمي لا يقوم على التكنولوجيا وحدها، وإنما يقوم على القدرة على تحويل التكنولوجيا والمعرفة والبيانات إلى ابتكارات ومشاريع تخلق قيمة اقتصادية مستدامة. وعليه، فإن الابتكار يمثّل الحلقة التي تربط المعرفة بالتكنولوجيا، والمشروع بالسوق، والنمو بالاقتصاد الرقمي.</p><div class='hp-formula'>الابتكار + التكنولوجيا الرقمية + ريادة الأعمال + إدارة المشاريع = خلق القيمة في الاقتصاد الرقمي</div><p>وبالنسبة للعراق، فإن بناء اقتصاد رقمي تنافسي يتطلب الانتقال من استهلاك التكنولوجيا إلى إنتاج الحلول الرقمية، ومن الأفكار إلى المشاريع، ومن المشاريع إلى شركات مبتكرة قابلة للنمو والتوسع.</p>"}],"terms":[["الابتكار (Innovation)","تحويل الفكرة أو الاختراع إلى تطبيق أو منتج أو خدمة يخلق قيمة قابلة للقياس."],["الاقتصاد الرقمي","الاقتصاد الذي تعتمد أنشطته بصورة متزايدة على البيانات والتقنيات والبنية التحتية الرقمية."],["المشروع الرقمي","مشروع يعتمد بصورة أساسية على التكنولوجيا أو البيانات أو المنصات الرقمية في خلق القيمة."],["منهجية Agile","منهجية إدارة مشاريع تعتمد على التطوير المرحلي وفرق صغيرة وسرعة الاستجابة للتغيير."],["Scrum / Sprints","تطبيق شهير لمنهجية Agile يعتمد على دورات تطوير قصيرة تُسمى Sprints."],["Prototype (النموذج الأولي)","نسخة أولية من المنتج تُستخدم للاختبار قبل التنفيذ الكامل."],["الابتكار المفتوح (Open Innovation)","اعتماد المؤسسة على مصادر داخلية وخارجية للمعرفة والأفكار والتكنولوجيا."],["FinTech (التكنولوجيا المالية)","تطبيق التكنولوجيا في المدفوعات والتحويلات والتمويل والخدمات المصرفية."]]}],"summary":[{"h":"مفاهيم أساسية","items":["الابتكار: تحويل فكرة أو معرفة جديدة إلى منتج أو خدمة أو عملية أو نموذج أعمال يخلق قيمة.","الفرق: الإبداع (فكرة) ← الاختراع (تقنية جديدة) ← الابتكار (تطبيق يخلق قيمة) ← ريادة الأعمال (تحويل الفرصة لمشروع).","أنواع الابتكار: منتجات، خدمات، عمليات، تنظيمي، نموذج أعمال، ورقمي.","الاقتصاد الرقمي يعتمد على البيانات والمنصات الرقمية بدل الاعتماد الأساسي على الأصول المادية."]},{"h":"دور الابتكار وإدارة المشاريع الرقمية","items":["يسهم الابتكار الرقمي في زيادة الإنتاجية، وخلق منتجات وخدمات ووظائف جديدة، وتعزيز التنافسية، ودعم ريادة الأعمال، وتحقيق الشمول المالي.","خصائص المشاريع الرقمية: سرعة التغيّر، عدم اليقين، الاعتماد على البيانات، والحاجة لفرق متعددة التخصصات.","مراحل المشروع الرقمي: تحديد المشكلة ← الفكرة ← دراسة الجدوى ← نموذج أولي ← اختبار ← تنفيذ ← إطلاق ← تقييم وتطوير.","منهجية Agile (وتطبيقها Scrum عبر Sprints) الأنسب للمشاريع الرقمية بسبب سرعة تغيّر التكنولوجيا والسوق."]},{"h":"محركات الابتكار وتحدياته","items":["أبرز التقنيات المحركة للابتكار: الذكاء الاصطناعي، البيانات الضخمة، الحوسبة السحابية، إنترنت الأشياء، سلسلة الكتل، والتكنولوجيا المالية.","النموذج: فكرة ← ابتكار ← فرصة اقتصادية ← مشروع رقمي ← قيمة اقتصادية ← نمو وتوسع.","الابتكار المفتوح يعتمد على مصادر داخلية وخارجية: الجامعات، الحاضنات، العملاء، المستثمرون.","أبرز التحديات: نقص المهارات، ضعف التمويل والبنية التحتية، المخاطر السيبرانية، وصعوبة الاستدامة المالية."]},{"h":"الابتكار في العراق والاستدامة","items":["قطاعات عراقية واعدة للابتكار الرقمي: المصرفي، التعليم، الصناعة، الزراعة، وإدارة الموارد المائية والحكومة.","نموذج تحليل متكامل لأي مشروع رقمي: المشكلة ← الفكرة ← الابتكار ← التكنولوجيا ← نموذج الأعمال ← المشروع ← السوق ← القيمة ← الاستدامة.","المعادلة الأساسية: الابتكار + التكنولوجيا الرقمية + ريادة الأعمال + إدارة المشاريع = خلق القيمة في الاقتصاد الرقمي.","الابتكار أداة للاستدامة الاقتصادية والاجتماعية، لا لزيادة الأرباح فقط."]}],"exercises":[{"lvl":"بسيط","t":"فرّق بين المفاهيم الأربعة","b":"اختر منتجًا أو خدمة رقمية تعرفها، وحدد فيها: أين ظهر الإبداع؟ وأين ظهر الاختراع (إن وجد)؟ وأين ظهر الابتكار تحديدًا؟ وأين ظهرت ريادة الأعمال؟"},{"lvl":"بسيط","t":"صنّف نوع الابتكار","b":"اذكر ثلاثة أمثلة من بيئة عملك أو محيطك (منتج، خدمة، أو عملية)، وحدد لكل مثال نوع الابتكار المناسب من الأنواع الستة الواردة في المحاضرة."},{"lvl":"متوسط","t":"طبّق مراحل المشروع الرقمي","b":"اختر فكرة مشروع رقمي بسيط، وسر بها عبر المراحل الثماني (تحديد المشكلة، توليد الفكرة، دراسة الجدوى، النموذج الأولي، الاختبار، التنفيذ، الإطلاق، التقييم) بجملة واحدة لكل مرحلة."},{"lvl":"متوسط","t":"قارن Agile بالتخطيط التقليدي","b":"اشرح موقفًا عمليًا واحدًا تكون فيه منهجية Agile أنسب من التخطيط الجامد طويل الأجل، وموقفًا آخر قد يكون فيه التخطيط التقليدي أنسب، مع التبرير."},{"lvl":"متوسط","t":"حلّل دراسة الحالة المصرفية","b":"أجب عن الأسئلة التحليلية الست الواردة في المحور الخامس عشر (دراسة حالة المنصة المصرفية الرقمية العراقية) بإجابات مختصرة ومحددة."},{"lvl":"متقدم","t":"مؤشرات قياس مشروع رقمي","b":"اختر مشروعًا رقميًا حكوميًا أو خاصًا تعرفه، واقترح له خمسة مؤشرات قياس من المؤشرات الواردة في المحور الرابع عشر، مع توضيح كيفية قياس كل مؤشر."},{"lvl":"متقدم","t":"مقالة نقاشية للدراسات العليا","b":"اختر سؤالًا واحدًا من أسئلة النقاش الواردة في نهاية المحاضرة (المحور السادس عشر) واكتب فيه مقالة من نصف صفحة مستندة إلى معادلة الاستدامة الاقتصادية."}],"quiz":{"mcq":[{"q":"الفرق الجوهري بين الاختراع والابتكار هو أن الابتكار:","opts":["مجرد فكرة جديدة لم تُطبَّق بعد","تحويل الفكرة أو الاختراع إلى تطبيق يخلق قيمة قابلة للقياس","إنتاج تقنية جديدة دون طرحها في السوق","نشاط لا علاقة له بالاقتصاد"],"correct":1,"explain":"الابتكار يتجاوز مجرد الفكرة أو الاختراع إلى تحويله لقيمة فعلية قابلة للقياس."},{"q":"«ابتكار نموذج الأعمال» يعني تحديدًا:","opts":["إنتاج سلعة جديدة","تحسين طريقة تقديم خدمة قائمة","إعادة تصميم الطريقة التي تحقق بها المؤسسة الإيرادات وتقدّم القيمة للعملاء","تغيير الهيكل التنظيمي فقط"],"correct":2,"explain":"ابتكار نموذج الأعمال يتعلق تحديدًا بطريقة تحقيق الإيرادات وتقديم القيمة، لا بالمنتج أو الهيكل وحدهما."},{"q":"أي مما يلي ليس من مكونات الاقتصاد الرقمي بحسب المحاضرة؟","opts":["البنية التحتية الرقمية","الأسواق المكانية التقليدية حصرًا","المنصات الرقمية","الحوسبة السحابية"],"correct":1,"explain":"الاقتصاد الرقمي يعتمد على الأسواق والمنصات الإلكترونية، لا الأسواق المكانية التقليدية حصرًا كما في الاقتصاد التقليدي."},{"q":"من مراحل المشروع الرقمي، تأتي «دراسة الجدوى» مباشرة بعد:","opts":["الإطلاق","توليد الفكرة","الاختبار","التقييم والتطوير"],"correct":1,"explain":"الترتيب: تحديد المشكلة ← توليد الفكرة ← دراسة الجدوى ← النموذج الأولي..."},{"q":"منهجية Agile تعتمد بصورة أساسية على:","opts":["التخطيط الجامد طويل الأجل قبل أي تنفيذ","التطوير المرحلي عبر دورات قصيرة وفرق صغيرة وتواصل مستمر","تنفيذ المشروع دفعة واحدة دون اختبار","الاعتماد الكامل على جهة واحدة دون فرق متعددة التخصصات"],"correct":1,"explain":"Agile تقوم على التطوير المرحلي (كما في Scrum وSprints) وسرعة الاستجابة للتغيير."},{"q":"«الابتكار المفتوح» (Open Innovation) يعني:","opts":["الاعتماد الحصري على الأفكار الداخلية للمؤسسة","اعتماد المؤسسة على مصادر داخلية وخارجية للمعرفة والأفكار والتكنولوجيا","رفض أي تعاون مع الجامعات أو الحاضنات","إغلاق المؤسسة أمام مصادر المعرفة الخارجية"],"correct":1,"explain":"الابتكار المفتوح يوسّع مصادر الابتكار لتشمل الجامعات والحاضنات والعملاء والمستثمرين، لا الاعتماد الداخلي الحصري."},{"q":"في نموذج «فكرة ← ابتكار ← فرصة اقتصادية ← مشروع رقمي ← قيمة اقتصادية ← نمو وتوسع»، ما الذي يربط الابتكار بريادة الأعمال؟","opts":["الابتكار يولّد الفرصة، وريادة الأعمال تحوّلها إلى مشروع","لا توجد علاقة بين الابتكار وريادة الأعمال","ريادة الأعمال تسبق الابتكار دائمًا","الفرصة الاقتصادية لا علاقة لها بالابتكار"],"correct":0,"explain":"الابتكار يولّد الفرصة، وريادة الأعمال هي التي تستثمر هذه الفرصة وتحوّلها إلى مشروع فعلي."}],"tf":[{"s":"يعني الابتكار مجرد إنتاج فكرة جديدة ومبتكرة دون الحاجة لتطبيقها.","correct":false,"explain":"هذا تعريف الإبداع لا الابتكار؛ الابتكار يتطلب تحويل الفكرة إلى قيمة قابلة للقياس."},{"s":"من خصائص المشاريع الرقمية ارتفاع مستوى عدم اليقين وسرعة التغيّر.","correct":true,"explain":"هذا مطابق لما ورد في المحور الخامس عن خصائص المشاريع الرقمية."},{"s":"Scrum منهجية بديلة تمامًا عن Agile ولا علاقة بينهما.","correct":false,"explain":"Scrum هو من أشهر تطبيقات منهجية Agile، وليس بديلًا مستقلًا عنها."},{"s":"يمكن للمشاريع الصغيرة الوصول إلى أسواق واسعة بفضل انخفاض تكاليف التكنولوجيا الرقمية.","correct":true,"explain":"هذا من أبرز أدوار الابتكار في دعم ريادة الأعمال بحسب المحاضرة."},{"s":"ينبغي النظر إلى الابتكار الرقمي بوصفه وسيلة لزيادة الأرباح فقط، بمعزل عن الاستدامة.","correct":false,"explain":"المحاضرة تؤكد أن الابتكار أداة لتحقيق الاستدامة الاقتصادية والاجتماعية والبيئية، لا الربح فقط."}],"scenario":[{"q":"شركة ناشئة عراقية طوّرت تطبيقًا للدفع الإلكتروني، لكنها لم تحدد بوضوح كيف ستحقق الإيرادات من التطبيق (عمولة، اشتراك، إعلانات...). في أي محور من محاور المشروع الرقمي يقع هذا القصور، وكيف يُعالَج؟","a":"القصور يقع في مرحلة دراسة الجدوى، وتحديدًا الجدوى الاقتصادية ونموذج الأعمال (كيف يحقق المشروع الإيرادات). يُعالَج بإعادة دراسة نموذج الأعمال وتحديد مصدر إيرادات واضح قبل الانتقال لمرحلة التنفيذ والإطلاق."},{"q":"مؤسسة حكومية تريد تطوير خدمة رقمية جديدة، وتتردد بين استخدام التخطيط التقليدي طويل الأجل أو منهجية Agile. ما العوامل التي يجب أن تحدد اختيارها؟","a":"يعتمد الاختيار على مدى استقرار المتطلبات ودرجة التغيّر المتوقعة: إن كانت بيئة العمل سريعة التغيّر وتحتاج تفاعلًا مستمرًا مع المستخدمين فمنهجية Agile أنسب، أما إذا كانت المتطلبات واضحة ومستقرة ولا تحتمل تعديلات متكررة فقد يكون التخطيط التقليدي كافيًا."}],"essay":[{"q":"ناقش كيف يمكن للجامعات أن تسهم في دعم الاقتصاد الرقمي من خلال مفهوم الابتكار المفتوح.","guide":"نقاط للتوجيه: دور الجامعة كمصدر معرفة وبحث، وتحويل نتائج البحث العلمي إلى مشاريع وشركات ناشئة، والتعاون مع الحاضنات والمستثمرين والعملاء ضمن منظومة ابتكار مفتوح."},{"q":"اختر قطاعًا عراقيًا واحدًا من القطاعات الواردة في المحور الثاني عشر، واقترح مشروعًا رقميًا مبتكرًا له، مستخدمًا نموذج التحليل المتكامل (المشكلة ← الفكرة ← الابتكار ← التكنولوجيا ← نموذج الأعمال ← المشروع ← السوق ← القيمة ← الاستدامة).","guide":"نقاط للتوجيه: التزم بالترتيب المنطقي للنموذج، وحدد بوضوح المشكلة الواقعية في القطاع المختار قبل اقتراح الحل التقني، ثم اربط الحل بمصدر إيرادات وأثر اقتصادي مستدام."}]}}}</script>

function bySubject(id){ for(var i=0;i<SUBJECTS.length;i++){ if(SUBJECTS[i].id===id) return SUBJECTS[i]; } return null; }

function loadProgress(){
  try{
    var raw = localStorage.getItem("hp_progress_v1");
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem("hp_progress_v1", JSON.stringify(p)); }catch(e){}
}
function setScore(subjectId, kind, correct, total){
  var p = loadProgress();
  if(!p[subjectId]) p[subjectId] = {};
  p[subjectId][kind] = {correct:correct, total:total};
  saveProgress(p);
  renderNav();
}
function subjectProgressPct(subjectId){
  var p = loadProgress()[subjectId];
  if(!p) return 0;
  var c=0,t=0;
  ["mcq","tf"].forEach(function(k){ if(p[k]){ c+=p[k].correct; t+=p[k].total; } });
  if(t===0) return 0;
  return Math.round((c/t)*100);
}

/* ---- Arabic text normalization + keyword coverage ---- */
function normAr(s){
  s = String(s==null?"":s);
  s = s.replace(/[ً-ْٰـ]/g,"");
  s = s.replace(/[إأآا]/g,"ا");
  s = s.replace(/[ىي]/g,"ي");
  s = s.replace(/ة/g,"ه");
  s = s.replace(/[ؤئء]/g,"ء");
  s = s.replace(/[^ء-ي0-9a-zA-Z\s]/g," ");
  s = s.toLowerCase();
  s = s.replace(/\s+/g," ").trim();
  return s;
}
function computeCoverage(points, answerText){
  var normAnswer = normAr(answerText);
  var results = points.map(function(p){
    var hit = (p.k||[]).some(function(kw){ return normAnswer.indexOf(normAr(kw)) > -1; });
    return {t:p.t, hit:hit};
  });
  var hits = results.filter(function(r){return r.hit;}).length;
  var pct = points.length ? Math.round(hits/points.length*100) : 0;
  return {results:results, pct:pct};
}
function coverageVerdict(pct){
  if(pct>=80) return {label:"ممتاز", cls:"excellent"};
  if(pct>=55) return {label:"جيد", cls:"good"};
  if(pct>=30) return {label:"جزئي", cls:"partial"};
  return {label:"يحتاج مراجعة", cls:"weak"};
}

function wireQuiz(subjectId){
  var host = document.getElementById("hpTabBody");
  var c = CONTENT[subjectId];
  var q = c.quiz;

  var mcqCorrect = 0, mcqAnswered = 0;
  var tfCorrect = 0, tfAnswered = 0;

  function updateScore(kind){
    if(kind==="mcq"){
      var el = host.querySelector('[data-score="mcq-'+subjectId+'"]');
      if(el) el.textContent = "النتيجة: "+mcqCorrect+" / "+q.mcq.length;
      setScore(subjectId,"mcq",mcqCorrect,q.mcq.length);
    } else {
      var el2 = host.querySelector('[data-score="tf-'+subjectId+'"]');
      if(el2) el2.textContent = "النتيجة: "+tfCorrect+" / "+q.tf.length;
      setScore(subjectId,"tf",tfCorrect,q.tf.length);
    }
  }

  host.querySelectorAll("[data-q-mcq]").forEach(function(qEl){
    var idx = parseInt(qEl.getAttribute("data-q-mcq"),10);
    var item = q.mcq[idx];
    var opts = qEl.querySelectorAll(".hp-opt");
    var answered = false;
    opts.forEach(function(btn, oi){
      btn.addEventListener("click", function(){
        if(answered) return;
        answered = true; mcqAnswered++;
        if(oi===item.correct){ mcqCorrect++; btn.classList.add("correct"); btn.querySelector(".hp-opt-mark").textContent="✓"; }
        else{
          btn.classList.add("wrong"); btn.querySelector(".hp-opt-mark").textContent="✕";
          opts[item.correct].classList.add("correct");
          opts[item.correct].querySelector(".hp-opt-mark").textContent="✓";
        }
        opts.forEach(function(b){ b.classList.add("disabled"); });
        var ex = qEl.querySelector("[data-explain]"); if(ex) ex.classList.add("show");
        updateScore("mcq");
      });
    });
  });

  host.querySelectorAll("[data-q-tf]").forEach(function(qEl){
    var idx = parseInt(qEl.getAttribute("data-q-tf"),10);
    var item = q.tf[idx];
    var btns = qEl.querySelectorAll(".hp-tf-btn");
    var answered = false;
    btns.forEach(function(btn){
      btn.addEventListener("click", function(){
        if(answered) return;
        answered = true; tfAnswered++;
        var val = btn.getAttribute("data-tf")==="true";
        var isCorrect = (val===item.correct);
        if(isCorrect){ tfCorrect++; btn.classList.add("correct"); }
        else{
          btn.classList.add("wrong");
          btns.forEach(function(b){ if((b.getAttribute("data-tf")==="true")===item.correct) b.classList.add("correct"); });
        }
        btns.forEach(function(b){ b.classList.add("disabled"); });
        var ex = qEl.querySelector("[data-explain]"); if(ex) ex.classList.add("show");
        updateScore("tf");
      });
    });
  });

  host.querySelectorAll("[data-reveal]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var wrap = btn.closest(".hp-q");
      var model = wrap.querySelector("[data-model]");
      model.classList.toggle("show");
      btn.textContent = model.classList.contains("show") ? "إخفاء الإجابة" : btn.getAttribute("data-label");
    });
  });

  host.querySelectorAll("[data-answer-toggle]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var wrap = btn.closest(".hp-q");
      var ans = wrap.querySelector("[data-answer]");
      ans.classList.toggle("show");
      btn.textContent = ans.classList.contains("show") ? "إخفاء الإجابة النموذجية" : btn.getAttribute("data-label");
    });
  });

  host.querySelectorAll("[data-compare]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var key = btn.getAttribute("data-compare");
      var sep = key.indexOf("-");
      var kind = key.slice(0, sep);
      var idx = parseInt(key.slice(sep+1), 10);
      var item = q[kind][idx];
      var wrap = btn.closest(".hp-q");
      var ta = wrap.querySelector("textarea");
      var model = wrap.querySelector("[data-model]");
      var cov = computeCoverage(item.points, ta ? ta.value : "");
      var v = coverageVerdict(cov.pct);
      var listHtml = item.points.map(function(p, pi){
        return '<li class="'+(cov.results[pi].hit?"hit":"miss")+'"><span class="hp-chk">'+(cov.results[pi].hit?"✔":"✕")+'</span><span>'+esc(p.t)+'</span></li>';
      }).join("");
      model.innerHTML =
        '<div class="hp-cov-head"><span class="hp-cov-pct '+v.cls+'">'+cov.pct+'%</span><span class="hp-cov-label '+v.cls+'">'+v.label+'</span></div>'+

        '<ul class="hp-cov-list">'+listHtml+'</ul>';
      model.classList.add("show");
      btn.textContent = "إعادة المقارنة";
    });
  });

  host.querySelectorAll("[data-retry]").forEach(function(btn){
    btn.addEventListener("click", function(){
      renderTabBody();
    });
  });
}

function adminStatus(msg, kind){
  var el = document.getElementById("hpAdminStatus");
  if(!el) return;
  el.textContent = msg;
  el.className = "hp-admin-status" + (kind ? " hp-admin-status-"+kind : "");
}
function adminPublishStatus(msg, kind){
  var el = document.getElementById("hpAdminPublishStatus");
  if(!el) return;
  el.textContent = msg;
  el.className = "hp-admin-status" + (kind ? " hp-admin-status-"+kind : "");
}

function adminValidate(){
  var ta = document.getElementById("hpAdminText");
  if(!ta) return;
  try{
    JSON.parse(ta.value);
    adminStatus("✓ الصيغة سليمة.", "ok");
  }catch(err){
    adminStatus("✗ خطأ في صيغة JSON: " + err.message, "err");
  }
}

function adminApply(){
  var ta = document.getElementById("hpAdminText");
  if(!ta) return;
  var parsed;
  try{
    parsed = JSON.parse(ta.value);
  }catch(err){
    adminStatus("✗ لم يتم التطبيق — خطأ في صيغة JSON: " + err.message, "err");
    return;
  }
  CONTENT[adminState.subjectId][adminState.key] = parsed;
  adminStatus("✓ تم التطبيق محليًا للمعاينة — تصفّح المادة لرؤية التغييرات. التغيير غير دائم إلا بعد الضغط على «نشر التحديثات».", "ok");
}

/* يبني وثيقة HTML كاملة ومستقلة من مصدر الصفحة الثابت (النمط + هيكل الواجهة + الكود)
   مع تضمين نسخة CONTENT الحالية (بعد أي تعديل) بدل النسخة الأصلية — هذا ما يُنشر. */
function buildFullHtml(){
  var styleEl = document.getElementById("hp-main-style");
  var styleText = styleEl ? styleEl.textContent : "";
  var mainScriptEl = document.getElementById("hp-main-script");
  var scriptText = mainScriptEl ? mainScriptEl.textContent : "";
  var dataJson = JSON.stringify(CONTENT).replace(/<\/script/gi, "<\\/script");

  var head = '<head>'+
    '<meta charset="UTF-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">'+
    '<title>Eng. Hussein Yaseen</title>'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">'+
    '<style id="hp-main-style">'+styleText+'</style>'+
  '</head>';

  var body = '<body>'+
    SHELL_HTML+
    '<script id="hp-data-block" type="application/json">'+dataJson+'</'+'script>'+
    '<script id="hp-main-script">'+scriptText+'</'+'script>'+
  '</body>';

  return '<!doctype html>\n<html lang="ar" dir="rtl">\n'+head+'\n'+body+'\n</html>';
}

function adminPublish(){
  adminPublishStatus("جارٍ النشر…", null);
  if(!window.claude || typeof window.claude.use !== "function"){
    adminPublishStatus("⚠️ ميزة النشر غير متاحة في بيئة العرض الحالية (تعمل فقط داخل الصفحة المنشورة على claude.ai).", "err");
    return;
  }
  window.claude.use("artifact").then(function(artifact){
    if(!artifact){
      adminPublishStatus("⚠️ ميزة النشر غير متاحة حاليًا لهذه الصفحة.", "err");
      return;
    }
    var html = buildFullHtml();
    return artifact.publish(html).then(function(){
      adminPublishStatus("✅ تم نشر التحديثات بنجاح — سيراها الجميع عند فتح الرابط أو تحديث الصفحة.", "ok");
    });
  }).catch(function(err){
    var code = err && err.code;
    if(code==="not_granted" || code==="not_writer" || code==="consent_required"){
      adminPublishStatus("⚠️ النشر متاح فقط لمالك المنصة — لا تملك صلاحية النشر على هذه الصفحة.", "err");
    } else if(code==="conflict"){
      adminPublishStatus("⚠️ نُشرت نسخة أخرى قبل محاولتك — أعد فتح اللوحة وحاول مجددًا.", "err");
    } else if(code==="too_large"){
      adminPublishStatus("⚠️ حجم المحتوى بعد التعديل أكبر من الحد المسموح للنشر.", "err");
    } else {
      adminPublishStatus("⚠️ تعذّر النشر: " + (err && err.message ? err.message : "خطأ غير معروف"), "err");
    }
  });
}

/* ======================================================================
   EVENTS (delegation)
   ====================================================================== */
document.addEventListener("click", function(e){
  var topBtn = e.target.closest("[data-scroll-top]");
  if(topBtn){ scrollToTop(); return; }
  var navBtn = e.target.closest("[data-nav]");
  if(navBtn){
    var type = navBtn.getAttribute("data-nav");
    if(type==="home") go("home");
    else if(type==="about") go("about");
    else if(type==="admin") go("admin");
    else if(type==="subject") go("subject", navBtn.getAttribute("data-id"), "overview");
    return;
  }
  var adminSubjBtn = e.target.closest("[data-admin-subject]");
  if(adminSubjBtn){
    adminState.subjectId = adminSubjBtn.getAttribute("data-admin-subject");
    adminState.key = "lectures";
    renderAdmin();
    return;
  }
  var adminKeyBtn = e.target.closest("[data-admin-key]");
  if(adminKeyBtn){
    adminState.key = adminKeyBtn.getAttribute("data-admin-key");
    renderAdmin();
    return;
  }
  if(e.target.closest("[data-admin-validate]")){ adminValidate(); return; }
  if(e.target.closest("[data-admin-apply]")){ adminApply(); return; }
  if(e.target.closest("[data-admin-publish]")){ adminPublish(); return; }
  var tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){
    state.tab = tabBtn.getAttribute("data-tab");
    var s = bySubject(state.subjectId);
    document.querySelectorAll(".hp-tab").forEach(function(b){b.classList.remove("active");});
    tabBtn.classList.add("active");
    renderCrumb();
    renderTabBody();
    renderNav();
    return;
  }
  var jump = e.target.closest("[data-tab-jump]");
  if(jump){
    state.tab = jump.getAttribute("data-tab-jump");
    renderCrumb();
    renderSubject();
    return;
  }
  var accToggle = e.target.closest("[data-acc-toggle]");
  if(accToggle){
    accToggle.closest("[data-acc]").classList.toggle("open");
    return;
  }
});

});
